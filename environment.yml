# Minimal environment for mcube. For the exact linux-64 versions it was
# developed with, see environment.lock.yml.
#   conda env create -f environment.yml
#   conda activate mcube
name: mcube
channels:
  - conda-forge
dependencies:
  - python=3.11            # xtb-python has no builds for newer Pythons
  - numpy
  - pyyaml
  - openmm
  - pdbfixer
  - openmmforcefields
  - openff-toolkit
  - parmed
  - rdkit
  - mdtraj
  - mdanalysis
  - xtb
  - xtb-python             # xTBTheory runmode='library' (used by neb)
  - geometric
  - pyscf
  - polars
  - pandas
  - networkx
  - matplotlib
  - pip
  - pip:
      - git+https://github.com/RagnarB83/ash.git
      - -e .
