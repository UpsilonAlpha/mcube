preprocess:
  inputs:
    protein_pdb: ../PROTEIN.pdb
    residue_variants: {A: {80: HIE}}
    ligand: LIG.pdb
    ligand_resname: LIG
    model:
    charge: -1
    cutoff: 2.6
    metals:
    - ZN
    - MG
    - MN
    - FE
    - CO
    - NI
    - CU
    - CD
    - CS
    - RB
    - SR
    - BA
    default_forcefields:
    - amber14/protein.ff14SB.xml
    - amber14/tip3p.xml
    skip_solvate: false
    implicit: true
    # pH: 8.0               # default 8.0 explicit, 7.0 implicit
    # solvent_padding: 10.0 # Angstrom, explicit only
    # ionic_strength: 0.1   # M, explicit only
    # exclude_residues: {A: [80]}  # chain -> resids left out of the QM region
    backbone_atoms:
    - N
    - H
    - H1
    - H2
    - H3
    - CA
    - HA
    - HA2
    - HA3
    - C
    - O
    - OXT
    amino_acids:
    - ALA
    - ARG
    - ASN
    - ASP
    - CYS
    - GLN
    - GLU
    - GLY
    - HIS
    - ILE
    - LEU
    - LYS
    - MET
    - PHE
    - PRO
    - SER
    - THR
    - TRP
    - TYR
    - VAL
    donor_elements: [N, O, S]   # elements that can coordinate a metal
md:
  inputs:
    cores: 8
    temp: 300
    npt_timestep: 0.001
    nvt_timestep: 0.004
    nvt_time: 500
    traj_frequency: 1000
    skip_npt: true
    skip_nvt: false
    implicit: true
    implicit_eps: 20
    gentle: false            # see the README: only if minimisation leaves it unstable
qmmm:
  inputs:
    cores: 4                 # xTB threads (see running-on-bunya.md)
    temp: 300
    timestep: 0.001
    time: 50
    traj_frequency: 50
    charge: 2
    mult: 1
    implicit: true
    xtb_method: GFN2
    skip_equilibrate: false
    skip_optimize: false
    actradius: 0                # >0: optimise atoms within this radius (Angstrom) of actregion_origin
    # actregion_origin: 5154    # atom index; default: first non-standard QM atom
neb:
  inputs:
    images: 8
    numfreq: true
    # actradius / actregion_origin default to the qmmm values

# PySCF QM/MM single point + cube files, run as its own stage so the SCF can
# have the cores and memory it scales with:
#   mcube sp config.yaml --pdb QM_MM_optimized.pdb
# Force fields, charge, mult and the QM region are inherited from qmmm.inputs.
sp:
  inputs:
    sp_functional: wb97x-v
    sp_basis: def2-svp
    # sp_cores: 64            # a DFT SCF scales; the xTB stages do not
