# Membrane protein in an explicit POPC bilayer (e.g. a class B GPCR with a bound peptide).
#
#   mcube preprocess config.yaml     # builds the bilayer, water and ions (CPU)
#   mcube md config.yaml             # minimise, membrane NPT, production (GPU)
#
# The membrane is built in the xy plane and nothing reorients the protein, so
# `protein_pdb` must already have the membrane normal along z and its hydrophobic belt
# centred on `membrane_center_z`. Membrane-aligned structures are published by the OPM
# database (http://opm.phar.umich.edu).
#
# Residues are numbered 1..N within each chain (as for every mcube config); renumber the
# input, and any residue_variants / extra_qm_residues with it. Chain IDs after solvation
# are OpenMM's A, B, C, ... in chain order, with the lipids and water after the protein.
#
# Commented keys show the default. Everything else a membrane run needs is on this page.
preprocess:
  inputs:
    protein_pdb: receptor_aligned.pdb      # z-aligned, belt centred on z = 0
    # ligand: PEPTIDE.pdb                  # a peptide agonist can also be a chain of protein_pdb
    membrane: true
    membrane_lipidtype: POPC               # POPC, POPE, DLPC, DLPE, DMPC, DOPC or DPPC
    # membrane_padding: 10.0               # Å from any protein atom to a box edge
    # membrane_center_z: 0.0               # Å: z of the bilayer midplane
    # membrane_lipid_xml: amber14/lipid17.xml
    ionic_strength: 0.15                   # M NaCl
    pH: 7.4
    default_forcefields:
    - amber14/protein.ff14SB.xml
    - amber14/tip3p.xml
    # residue_variants: {A: {83: HIE}}     # histidine tautomers etc., by input chain ID
    # metals:                              # none: no coordination restraints, no QM region
md:
  inputs:
    membrane: true                         # defaults to preprocess.inputs.membrane
    platform: CUDA                         # a bilayer is large; CPU is far too slow
    properties: {Precision: mixed}
    cores: 8
    temp: 300                              # K, required: the barostat is built at this temperature
    npt_timestep: 0.002                    # ps
    npt_time: 2000                         # ps; a bilayer needs ns to settle its area per lipid
    nvt_timestep: 0.004                    # ps; production keeps the membrane barostat (NPT)
    nvt_time: 100000                       # ps
    traj_frequency: 2500                   # steps between frames
    # surface_tension: 0.0                 # bar*nm; 0 = tensionless bilayer
    # pressure: 1.0                        # bar
    # barostat_frequency: 25               # steps between barostat moves
    # nonbonded_cutoff: 12.0               # Å
    # gentle: false                        # warm-up, only if minimisation leaves it unstable
    #
    # Run in segments, or continue from any frame (each stage restarts from a PDB with a box):
    #   pdb_file: md_eq/relaxbox_NPT_lastframe.pdb
    #   skip_npt: true
    #   nvt_time: 5000
postprocess:                               # optional: `mcube postprocess` writes membrane_report.* for a membrane run
  inputs:
    membrane:
      frame_ps: 50                         # ps between frames (0: frame number only)
      # receptor: A                        # chain letters; default: first and second protein chain
      # partner: B
      # core_z: 15                         # receptor CA within this many Å of the midplane superpose the frames
      # core_exclude: [[290, 330]]         # residues kept out of that core (a mobile helix)
      # site: [203, 345, 349]              # receptor residues the partner should reach
      # contact: 4.5                       # heavy-atom contact cutoff in Å
      # footprint: glp1_footprint.txt      # reference contact set; write_footprint: writes one from this run
      # track: {tm6ic: 310}                # CA displacement, radial distance and z of a residue
      # distance: {gate: [319, 322]}       # CA-CA distance
      # angle: {kink: [315, 319, 323]}     # CA-CA-CA angle
