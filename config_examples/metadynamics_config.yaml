# Well-tempered metadynamics of La3+ on its carboxylate coordination number n_COO, at the
# constriction of a membrane channel, where the ion holds a Glu for longer than an umbrella
# window runs. Builds on the umbrella example (config_examples/umbrella_config.yaml): the
# same preprocess/md/umbrella sections, and a finished MM umbrella window at z0 = 0 to start from.
#
#   mcube metadynamics config.yaml run                          # n_COO at z0 = 0 (GPU); run again to extend
#   mcube metadynamics config.yaml fes                          # F(n_COO), integer states, 50/75/100 % check
#   mcube metadynamics config.yaml run --section metadynamics_lu
#   mcube metadynamics config.yaml run --section metadynamics_2d
#
# preprocess, md and qmmm as in umbrella_config.yaml
umbrella:
  inputs:
    ion: "C:1:LA"
    reference: "chain A and name CA"       # z = 0 is the barrel's centre
    z_start: -35.0
    z_end: 35.0
    spacing: 0.5
    k: 10.0
    cylinder: {radius: 10.0, k: 10.0}
    timestep: 0.004
    platform: CUDA
    properties: {Precision: mixed}
    # ion, reference, cylinder, k, timestep, platform, properties, temp, metal parameters
    # (metal_parameters, c4_set, c4_pairs, polarizabilities), cn_cutoff and nonbonded_cutoff
    # carry over to metadynamics from here
metadynamics:
  # Mode 1: n_COO biased inside the umbrella window at z0 = 0; z held there by k and the cylinder
  inputs:
    cvs: [n_coo]
    z0: 0.0                                # A; the seed is umbrella.results.windows at z0 = 0 (its lastframe)
    height: 1.0                            # kJ/mol
    sigma: {n_coo: 0.1}
    grid: {n_coo: {min: 0.0, max: 6.0}}    # bidentate Glu + Asp: up to 4 O; leave headroom
    biasfactor: 10
    frequency: 500                         # steps between hills (2 ps)
    time: 20000                            # ps; each further `run` adds this much
    cv_frequency: 250
    traj_frequency: 25000
    # cn_cutoff: 3.0                       # r0 of the switching function, A (default: preprocess cutoff)
metadynamics_lu:
  # The same for Lu3+ with a literature C4 set: only what differs
  inputs:
    ion: "C:1:LU"
    seed_section: umbrella_lu              # an umbrella section of the Lu run, with a window at z0
    c4_set: kantakevicius2022_chbe_tip3p
metadynamics_2d:
  # Mode 2: (z, n_COO) biased together across the constriction; the cylinder still confines
  # the ion in xy, the z restraint is off, and flat walls keep z on the grid
  inputs:
    cvs: [z, n_coo]
    z0: 0.0                                # only picks the seed here
    sigma: {z: 0.3, n_coo: 0.1}
    grid: {z: {min: -8.0, max: 8.0}}
    z_walls: {min: -7.0, max: 7.0, k: 10.0}
    time: 50000
