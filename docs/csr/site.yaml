# CSR-1 / meropenem: the active site, and every calculation we run on it.
#
# Atom selectors are mcube's "chain:resid:atom". Everything CSR-specific lives
# here, so site.py and sections.py stay general and no calculation needs its own
# Python file.
#
#   python sections.py site.yaml <name> [<name> ...]   add sections to config.yaml
#   python site.py sphere      <pdb> [pdb ...]         Zn sphere and protonation
#   python site.py nucleophiles <pdb>                  attack geometry + proton acceptors
#   python site.py acceptors   <traj> <top>            what can take the proton, counted
#   python site.py joint       <traj> <top>            attack AND donate, same molecule
#   python site.py check       <pdb> --at=start       accept or reject a structure

site:
  metal: B:1:ZN
  electrophile: C:1:C4x        # the carbon under attack
  carbonyl_o: C:1:O2x          # defines the attack angle Nu-C-O
  leaving_n: C:1:N1x

  # Candidate nucleophiles named explicitly; site.py also scans for any water
  # near the electrophile, so this is for labelling rather than restriction.
  nucleophiles:
    O01 (Zn-bound, ex-HOH493): C:2:O01
    HOH485 (Zn-bound): D:1:O

  # Anything that could accept the nucleophile's proton.
  bases:
    Asp92 OD1: A:92:OD1
    Asp92 OD2: A:92:OD2
    Lys226 NZ: A:226:NZ
    mer O4x: C:1:O4x           # the substrate's own C3 carboxylate
    mer O3x: C:1:O3x
    mer O1x: C:1:O1x           # 6-alpha-OH

  # Reported for every structure, so the whole first shell is always visible.
  monitor:
    Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
    # ¶120: every monitor, scan and constraint in this file named OD2, which is
    # the oxygen that does NOT coordinate. OD1 was the one that migrated onto the
    # metal, at 1.99-2.07 A, and nothing was watching it.
    Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
    # The carboxylate CARBON, not an oxygen: a profile along Zn-OD1 is
    # contaminated every time the carboxylate rotates OD2 in and OD1 out, which
    # is exactly the motion ¶120 was about. Zn-CG moves only when the whole
    # group moves, which is the coordinate the free energy is wanted along -
    # the same choice the classical carboxylate-cation PMFs make.
    Zn-Asp92 CG: [B:1:ZN, A:92:CG]
    Zn-O01: [B:1:ZN, C:2:O01]
    Zn-HOH485: [B:1:ZN, D:1:O]
    Zn-His88: [B:1:ZN, A:88:NE2]
    Zn-His164: [B:1:ZN, A:164:NE2]
    Zn-mer O2x: [B:1:ZN, C:1:O2x]
    # ¶144: O1x, the 6-alpha-hydroxyethyl oxygen, is the closest substrate atom
    # to the zinc in every run we have (3.00 A minimum over 5,000 frames,
    # against the carbonyl's 5.98) and the ligand the `substituent_on_metal`
    # hypothesis is about - and it was in no monitor, so no report ever printed
    # it. It is here now.
    Zn-mer O1x: [B:1:ZN, C:1:O1x]
    O01-C4x: [C:2:O01, C:1:C4x]
    HOH485-C4x: [D:1:O, C:1:C4x]
    C4x-N1x: [C:1:C4x, C:1:N1x]

    # ---- the RQK triad and the residues that hold the substrate (¶148) ----
    # Arg90 (BBL R118) stands where Zn1's third histidine would be; Gln93
    # (Q121) and Lys226 (K263) stand on two of Zn2's three ligand positions,
    # which is why there is no Zn2. **Asp92 (¶120) is NOT orphaned, corrected
    # ¶209:** Lys226's ammonium holds its OD2 at 2.99 A in 6DN4 and 2.83 A in
    # 6DQ2, i.e. the lysine does on one side what Zn2 does at ~2.1 A in every
    # canonical B3. 6NC5 lacks the contact only because its `SEQADV` records
    # Lys226His as an engineered mutation - the lysine had to be removed before
    # a zinc would bind Zn2, which is the thesis with a crystal behind it.
    # SMB-1's Gln157 hydrogen-bonds the carbonyl oxygen at 1.67-1.70 A through
    # ES, TS and EI and is called the oxyanion hole there (Mu & Xu 2020); our
    # Gln93 is at a different BBL position, so whether it reaches the carbonyl
    # at all is a measurement, not an analogy. It had never been monitored.
    Gln93 NE2-mer O2x: [A:93:NE2, C:1:O2x]
    Gln93 OE1-mer O2x: [A:93:OE1, C:1:O2x]
    Gln93 NE2-O01: [A:93:NE2, C:2:O01]
    Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]
    Arg90 NH1-mer O1x: [A:90:NH1, C:1:O1x]
    Arg90 NH2-mer O1x: [A:90:NH2, C:1:O1x]
    Arg90 NH1-O01: [A:90:NH1, C:2:O01]
    Arg90 NH1-HOH485: [A:90:NH1, D:1:O]
    Lys226 NZ-O01: [A:226:NZ, C:2:O01]
    # ¶209/¶210: the salt bridge, and it had never been monitored anywhere.
    # Lys254 NZ - Asp120 OD2 is 2.99 A in 6DN4 and 2.83 A in 6DQ2 (our Lys226 -
    # Asp92; both deposits are BBL numbering). OD2 is the BRIDGING oxygen: 2.76 A
    # from the zinc on one side by superposition, 2.99 A from the lysine on the
    # other, with OD1 pointing away from both (3.90 and 5.06 A). Both oxygens are
    # here because ¶120 is what happens when only one of them is watched.
    Lys226 NZ-Asp92 OD2: [A:226:NZ, A:92:OD2]
    Lys226 NZ-Asp92 OD1: [A:226:NZ, A:92:OD1]
    Lys226 NZ-mer O3x: [A:226:NZ, C:1:O3x]
    Lys226 NZ-mer O4x: [A:226:NZ, C:1:O4x]
    Arg229 NH1-mer O3x: [A:229:NH1, C:1:O3x]
    Arg229 NH2-mer O4x: [A:229:NH2, C:1:O4x]
    Ser186 OG-mer O4x: [A:186:OG, C:1:O4x]
    Asn225 ND2-O01: [A:225:ND2, C:2:O01]

  # `site.py contacts` - the pairs above over a trajectory. 3.5 A is the usual
  # polar-contact convention for heavy-atom pairs, and the same number ¶32's
  # one-off analysis used, so its occupancies can be compared with these.
  contacts:
    cutoff: 3.5

  # Near-attack criteria. The angle window is a working tolerance around the
  # Burgi-Dunitz value of ~107 degrees, not a literature constant; the distance
  # is the usual near-attack-conformation convention. Both are choices, so they
  # live here where they can be seen and changed.
  burgi_dunitz:
    angle: [95, 120]
    max_distance: 4.5
    hbond: 2.6                 # H...acceptor, for "is a proton pointing at it"
    metal_bound: 2.6           # Zn-O below this counts as a zinc ligand

  # `site.py shell` - the coordination sphere over a trajectory. The cutoff is
  # the same 2.6 A `burgi_dunitz.metal_bound` uses for "is this a zinc ligand",
  # kept as its own key because this is a different question (what the whole
  # shell is) and may want a different answer. `margin` only widens what gets
  # printed: a donor between 2.6 and 3.6 A is listed with its occupancy so a
  # borderline ligand is visible rather than silently absent.
  # The docking receptor is a separate file, prepared before solvation, so its
  # numbering need not match the simulated system's.
  docking:
    receptor_metal: B:2:ZN     # CSR_nontruncated_1metal.pdb; B:1:ZN in the system

  shell:
    cutoff: 2.6
    margin: 1.0
    donor_elements: [O, N, S]
    metals: [B:1:ZN]

  # `site.py check` - the acceptance criteria for a Michaelis complex, which is
  # the guard that was missing in ¶123. Everything here was already measured and
  # recorded; what did not exist was a command that reads a structure and says
  # whether it qualifies, so the October pose was accepted by eye with its
  # carbonyl 5.43 A from the metal and ran for two weeks.
  #
  # `required_at` is the stage at which a violation is a FAIL rather than a
  # WARN. `start` is a candidate structure before equilibration; `reactant` is
  # the frame a QM/MM run would begin from. The two differ deliberately: a
  # grafted pose has not yet been pulled onto the attack line, so requiring the
  # attack distance and angle of it would reject a structure for not yet being
  # the thing the simulation is meant to produce. Run the check at BOTH ends -
  # `--at=start` on the grafted structure, `--at=reactant` on the last frame -
  # because ¶120's five-coordinate zinc appeared during the MM, not before it.
  # A criterion is only a criterion WITHIN a mechanism. ¶125 wrote "the closest
  # substrate oxygen must be the beta-lactam carbonyl" as though it were a fact
  # about Michaelis complexes. It is a fact about the carbonyl-on-metal
  # mechanism, and that mechanism is the thing under test: ¶126 found a
  # candidate complex that violates it while satisfying the attack geometry at
  # 3.17 A and 106 degrees. A gate that rejects a competing hypothesis by
  # assuming the first one is not a gate, it is a way of never testing
  # anything. So each hypothesis carries its own criteria, `site.py check
  # --hypothesis=<name>` picks one, and the output names it.
  michaelis_hypotheses:

    # The planned mechanism: the metal holds the beta-lactam carbonyl, loosely,
    # while a metal-bound hydroxide attacks it. Thermolysin and carboxypeptidase
    # A both do this on one zinc (¶124), and L1's time-resolved Michaelis
    # complexes measure the carbonyl at 2.53-2.63 A from Zn1 (¶121). What we do
    # NOT have is a structure of our own in this arrangement: ¶126 showed no
    # docked pose puts anything within 5 A of the metal, so a start structure
    # for this hypothesis has to be built by restraint rather than found.
    carbonyl_on_metal:
      - name: closest substrate O
        closest_to: B:1:ZN
        among: [C:1:O2x, C:1:O1x, C:1:O3x, C:1:O4x]
        must_be: C:1:O2x
        required_at: [start, reactant]
        source: ¶123; the October pose gave O1x 3.13 and the carbonyl 5.43

      - name: Zn - carbonyl O2x
        atoms: [B:1:ZN, C:1:O2x]
        range: [2.4, 3.0]
        required_at: [start, reactant]
        source: loose; L1 7UHJ 2.63, thermolysin 2.41, CPA 2.98 (¶121, ¶124)

      # MOVED to `reactant` only. The 1.9-2.2 A window is from crystal
      # structures, and our MM zinc does not reproduce crystal bond lengths: in
      # the grafted frame the whole sphere is systematically off - hydroxide
      # 1.86 A (short), His88 2.22 and His164 2.32 A (long) - and ¶48 and ¶118
      # both measured this bond relaxing from 1.83-1.86 A to 1.99-2.05 A once
      # QM/MM took over. Gating an MM structure on an absolute Zn-donor bond
      # length therefore tests the force field, not the structure. The
      # criteria that stay at `start` are the ones that DISCRIMINATE between
      # the hypotheses - which oxygen is on the metal, and the substrate
      # geometry - where the difference is 1.8 A and no force-field artefact
      # accounts for it.
      - name: Zn - nucleophile O01
        atoms: [B:1:ZN, C:2:O01]
        range: [1.9, 2.2]
        required_at: [reactant]
        source: tight; thermolysin 2.01, CPA 2.19 (¶124) - crystal values

      # FIVE is allowed here, and only here, and the target is still four.
      # The resting site is four-coordinate - 2 His + 2 waters (¶120). On
      # binding, the substrate DISPLACES one of those waters and the other
      # becomes the nucleophilic hydroxide, so the complex this project is
      # trying to build is **2 His + hydroxide + carbonyl = four**.
      #
      # Five is not rejected, for two reasons. GOB-18's B3 site expands four-
      # to five-coordinate on substrate binding (reference-structures.md), so
      # a retained second water is a real possibility rather than a build
      # error. And Asp92 OD2 sits at 2.80 A in the crystal as a second-shell
      # contact (¶120): a frame where it drifts inside the 2.5 A measurement
      # radius counts as five here while not being five-coordinate in any
      # chemical sense. Demanding exactly four would reject both of those for
      # the wrong reason (user's decision, ¶196).
      - name: Zn coordination number
        coordination: B:1:ZN
        range: [4, 5]
        required_at: [reactant]
        source: 2 His + hydroxide + carbonyl = 4; 5 tolerated, see above (¶196)

      - name: O01 - C4x (attack)
        atoms: [C:2:O01, C:1:C4x]
        range: [3.0, 3.5]
        required_at: [reactant]
        source: near-attack convention; 4.5 A is the outer bound (burgi_dunitz)

      # NOT required at `reactant`, and the reason is measured (¶201). The
      # 95-120 window is a TRANSITION-STATE criterion. At fixed O01...O2x the
      # attack angle is a function of the approach distance alone, and at a
      # reactant separation of 3.0-3.2 A thermolysin's own geometry - the
      # source of the two Zn-O windows above - gives 26-38 degrees. 1TMN
      # reaches 95 degrees only at Nu-C = 1.64 A and 7CPA at 2.06 A; ours,
      # whose O...O is wider, reaches it at 2.47-2.69 A, i.e. EARLIER along the
      # approach than either reference. Demanding it of a reactant rejects the
      # zinc-bound-nucleophile mechanism by construction, which is what it did
      # from ¶33 to ¶200. `required_at` therefore names a stage `site.py check`
      # is never called with, so the angle still PRINTS and warns - it is worth
      # watching - but cannot fail a structure. See P10.
      - name: O01 - C4x - O2x angle
        atoms: [C:2:O01, C:1:C4x, C:1:O2x]
        range: [95, 120]
        required_at: [transition_state]
        source: Burgi-Dunitz, at the TS; 26-38 deg is correct at 3.0-3.2 A (¶201)

      # What the angle was meant to ask, asked at the reactant instead: are the
      # nucleophile and the carbonyl correctly placed relative to each other on
      # one metal. Both windows are measured from 1TMN and 7CPA directly, not
      # from a review (¶201), and both reference enzymes are strongly CIS -
      # which is why ¶200's "they must be trans" was withdrawn.
      - name: O01 - Zn - O2x
        atoms: [C:2:O01, B:1:ZN, C:1:O2x]
        range: [45, 95]
        required_at: [reactant]
        source: measured 1TMN 57.2, 7CPA 60.1; batch 1 71.8 (¶201)

      - name: O01 ... O2x separation
        atoms: [C:2:O01, C:1:O2x]
        range: [2.0, 3.3]
        required_at: [reactant]
        source: measured 1TMN 2.15, 7CPA 2.68; batch 1 3.05 (¶201)

      - name: Asp92 OD1 - O01
        atoms: [A:92:OD1, C:2:O01]
        range: [2.5, 3.2]
        required_at: [reactant]
        source: H-bond not coordination; ¶119 measured 2.82-2.94 at 100% frames

    # The arrangement the grafted pose-2 structure actually presents (¶126).
    # The metal holds the 6-alpha-hydroxyethyl O1x at 2.66 A, the carbonyl
    # points away at 4.50 A, and the zinc-bound hydroxide sits on the attack
    # line at 3.17 A and 106 degrees - inside the Burgi-Dunitz window that ¶34
    # never reached in 791 frames, with Asp92 OD1 at 2.87 A as general base.
    #
    # It is a hybrid of the two routes ¶124 separated: the nucleophile is
    # metal-bound and on the attack line, as in thermolysin and CPA, while the
    # metal holds a substituent oxygen rather than the carbonyl, as GOB-18 does
    # with the C-3 carboxylate. It is listed here as a hypothesis to be tested,
    # not a preferred one: nothing says a 6-alpha-hydroxyethyl oxygen belongs on
    # a Zn1-site metal, and the carbonyl distance range below is our own
    # measurement plus tolerance, not a reference value. Marked as such.
    substituent_on_metal:

      - name: closest substrate O
        closest_to: B:1:ZN
        among: [C:1:O2x, C:1:O1x, C:1:O3x, C:1:O4x]
        must_be: C:1:O1x
        required_at: [start, reactant]
        source: ¶126 measured 2.66 A; GOB-18 binds a substituent, its C-3 COO-

      - name: Zn - O1x (6a-OH)
        atoms: [B:1:ZN, C:1:O1x]
        range: [2.0, 2.8]
        required_at: [start, reactant]
        source: NOT a reference value - ¶126's own 2.66 A plus tolerance

      - name: Zn - carbonyl O2x is OUT
        atoms: [B:1:ZN, C:1:O2x]
        range: [3.5, 20.0]
        required_at: [start, reactant]
        source: the distinguishing negative; ¶126 measured 4.50 A

      # MOVED to `reactant` only. The 1.9-2.2 A window is from crystal
      # structures, and our MM zinc does not reproduce crystal bond lengths: in
      # the grafted frame the whole sphere is systematically off - hydroxide
      # 1.86 A (short), His88 2.22 and His164 2.32 A (long) - and ¶48 and ¶118
      # both measured this bond relaxing from 1.83-1.86 A to 1.99-2.05 A once
      # QM/MM took over. Gating an MM structure on an absolute Zn-donor bond
      # length therefore tests the force field, not the structure. The
      # criteria that stay at `start` are the ones that DISCRIMINATE between
      # the hypotheses - which oxygen is on the metal, and the substrate
      # geometry - where the difference is 1.8 A and no force-field artefact
      # accounts for it.
      - name: Zn - nucleophile O01
        atoms: [B:1:ZN, C:2:O01]
        range: [1.9, 2.2]
        required_at: [reactant]
        source: tight; thermolysin 2.01, CPA 2.19 (¶124) - crystal values

      - name: O01 - C4x (attack)
        atoms: [C:2:O01, C:1:C4x]
        range: [3.0, 3.5]
        required_at: [start, reactant]
        source: ¶126 measured 3.17 A with no restraint on this coordinate

      - name: O01 - C4x - O2x angle
        atoms: [C:2:O01, C:1:C4x, C:1:O2x]
        range: [95, 120]
        required_at: [start, reactant]
        source: ¶126 measured 106 deg; this is why the hypothesis is listed

      # Five for the same reason as the other hypothesis (¶196): the
      # substituent oxygen displaces a water rather than filling a vacancy
      # the resting site does not have, and a retained second water or a
      # drifting Asp92 OD2 should not fail the frame on its own.
      - name: Zn coordination number
        coordination: B:1:ZN
        range: [4, 5]
        required_at: [reactant]
        source: 2 His + hydroxide + O1x = 4; 5 tolerated, see above (¶196)

      - name: Asp92 OD1 - O01
        atoms: [A:92:OD1, C:2:O01]
        range: [2.5, 3.2]
        required_at: [reactant]
        source: H-bond not coordination; ¶126 measured 2.87 A

# Calculations. Each becomes a section in config.yaml. The starting structure is
# `inputs.pdb_file` like any other input - there is no separate `start` key and
# no structure on the command line, so the config says what was computed - and
# sections.py checks that it exists and that every atom selector resolves in it.
# Paths in `inputs.pdb_file` are read against this directory (the config's),
# whichever directory the job script runs the stage from. Anything mcube's stage
# accepts can go in `inputs` verbatim, so adding a calculation is a few lines
# here.
#
# NOTE: `forcefields` and `default_forcefields` are the exception - OpenMM
# resolves those itself, from the directory the stage runs in, which is why they
# still carry `../` or `../../`.
# ---- QM regions with the RQK set in MM (¶190) ----
#
# Charge deletion cannot reach a residue that is already quantum: electrostatic
# embedding has removed its MM charges and `zero_charges` refuses it by name
# (¶153). Arg90 and Lys226 were inside the QM region in all eleven systems, so
# only Gln93 and Arg229 were ever measurable - and the paper's thesis is about
# R, Q and K. The user's decision is to put **all four in MM**, so the whole set
# is decomposed one way rather than two of it one way and two another.
#
# Leaving the QM region: **Arg90 and Lys226**. Staying: the zinc, its ligands,
# Asp92 (the subject), the substrate. Arg229 and Gln93 were never in it.
#
# **The QM charge therefore drops by 2 and is stated on every section.** Both
# arms were +2 with the cations in - Zn(2+), Asp92(-1), the ligand (-1 for the
# hydrolysed product, 0 for the reactant's zwitterion), the hydroxide (-1 on
# the reactant), Arg90(+1), Lys226(+1). Without the two cations both arms are
# **0**. A section left at the inherited 2 converges its SCF on the wrong
# species while looking entirely normal (¶152).
#
# Anchors rather than nine copies: YAML expands them on load, so what
# `sections.py` writes into a run's config.yaml is the literal mapping.
qm_regions:
  product: &qmreg_prod
    B: {1: ZN}
    C: {1: HOH, 2: HOH}
    A: {88: HIS, 164: HIS, 92: ASP}
    D: {1: hyd}
  reactant: &qmreg_wt
    B: {1: ZN}
    D: {1: HOH}
    C: {2: OH, 1: mer}
    A: {88: HIS, 164: HIS, 92: ASP}

  # The Michaelis rebuild's own region. Two differences from `reactant`, both
  # forced by what the system is rather than chosen:
  #
  # **No `D: {1: HOH}`.** That water was removed to vacate the carbonyl's
  # position (¶196), so naming it here would refuse the section - which is the
  # check working, not an obstacle.
  #
  # **Asn225 is IN.** ¶197 found Asn225 OD1 coordinating the zinc in 17.9% of
  # `md_eq5`'s frames, and at **2.19 A** in the frame this run starts from -
  # inside the 2.5 A bond radius by any reading. A donor that close left in MM
  # would have a coordinate bond represented by point charges, which is the one
  # thing electrostatic embedding cannot do. It was not in any earlier arm's
  # region because it was not known to be a donor until ¶197.
  #
  # Charge is unchanged at **0**: Zn(2+) -1 (Asp92) -1 (hydroxide) + 0 (the
  # reactant's zwitterionic ligand) + 0 (neutral Asn225, two neutral His), with
  # Arg90 and Lys226 in MM per ¶190. Stated on the section regardless (¶152).
  michaelis: &qmreg_mich
    B: {1: ZN}
    C: {2: OH, 1: mer}
    A: {88: HIS, 164: HIS, 92: ASP, 225: ASN}

  # The same region with the two RQK cations back INSIDE it (user, 2026-11-04).
  # This does not revert ¶190. It splits the four cations by the kind of role
  # each one has, because the user's decision is that **both** measurements have
  # to happen and one region cannot carry both.
  #
  # Charge deletion answers an ELECTROSTATIC question: zero a residue's MM point
  # charges on an unchanged geometry and difference the energy. It cannot answer
  # a CHEMICAL one. A residue that transfers a proton has a contribution that
  # deleting a point charge does not represent, whatever region it sits in, so
  # for such a residue deletion is the wrong instrument rather than an
  # unavailable one. That is why ¶190's objection does not bind here.
  #
  # Which cation is which is measured, not assumed:
  #
  #   Arg90, Lys226   Lys226 NZ ends batch 1 at 2.82 A from the nucleophile, 92%
  #                   occupancy (¶201), and the transfer is downhill in xTB
  #                   (¶29), at DFT (¶35) and by 5.2 kcal/mol in a clean sphere
  #                   (¶48). An MM lysine cannot do it, so batch 1 did not test
  #                   the reactant's protonation state - it excluded it. Arg90
  #                   comes with it: it was inside the region in all eleven
  #                   pre-¶190 systems and it is the other cation in contact
  #                   range of the substrate's own atoms.  -> QM, here.
  #   Arg229, Gln93   Arg229 holds the substrate carboxylate at 3.62 +/- 0.04 A
  #                   across all 45 grid points and both trajectories (¶150) and
  #                   never approaches a transferable proton; Gln93 is an amide.
  #                   Both are second-sphere electrostatics, which is what
  #                   deletion measures.  -> MM, so `zero_charges_qm_only` still
  #                   reaches them and the R and the Q of RQK keep the number
  #                   ¶190 was protecting.
  #
  # So K's catalytic role comes out of this trajectory chemically and R229/Q93's
  # out of deletion. K's electrostatic row, if the paper still wants one, comes
  # from mutagenesis - ¶190 already names that as the second campaign - or from
  # an `sp` pair run on THESE frames with the all-MM region, where both members
  # share a region and the difference is still one key apart (¶152).
  #
  # **Charge +2, not 0**: the michaelis region's 0 plus Arg90(+1) and
  # Lys226(+1). That is the value the eleven pre-¶190 systems carried, which is
  # the arithmetic check on it. Stated on the section regardless (¶152).
  michaelis_rk: &qmreg_michrk
    B: {1: ZN}
    C: {2: OH, 1: mer}
    A: {88: HIS, 164: HIS, 92: ASP, 225: ASN, 90: ARG, 226: LYS}

sections:

  # ¶42. Each of these is an optimisation only; score the result with a
  # separate `sp_dft` run on its QM_MM_optimized.pdb, which is how the DFT
  # single point gets 64 cores while the xTB optimisation does not need them.
  cleanR_lysH:                 # proton on Lys226
    stage: qmmm
    inputs:
      pdb_file: md_results/NVTtrajectory_lastframe.pdb
      skip_equilibrate: true
      opt_maxiter: 600
      opt_constraints:
        - [B:1:ZN, A:92:OD2, 2.80]
        - [B:1:ZN, C:1:O2x, 2.90]
        - [A:226:NZ, A:226:HZ1, 1.03]

  cleanR_ohH:                  # proton on O01
    stage: qmmm
    inputs:
      pdb_file: md_results/NVTtrajectory_lastframe.pdb
      skip_equilibrate: true
      opt_maxiter: 600
      opt_constraints:
        - [B:1:ZN, A:92:OD2, 2.80]
        - [B:1:ZN, C:1:O2x, 2.90]
        - [C:2:O01, A:226:HZ1, 0.98]

  md_pose:                     # ¶59: is the substrate pose robust?
    stage: qmmm
    inputs:
      pdb_file: protdft/coscan/scan_08.pdb
      skip_equilibrate: false
      skip_optimize: true
      time: 25
      timestep: 0.001
      traj_frequency: 50
      temp: 300
      cores: 4                 # xTB saturates ~4 threads; see docs/csr/README.md

  scan_znasp:                  # ¶53: pull Asp92 off the zinc
    stage: scan
    inputs:
      pdb_file: protdft/zncheck/relax/QM_MM_optimized.pdb
      atoms: [B:1:ZN, A:92:OD2]
      start: 2.05
      end: 3.05
      points: 9
      opt_maxiter: 300
      resume: true

  scan_znco:                   # ¶58: pull the substrate carbonyl off the zinc
    stage: scan
    inputs:
      pdb_file: protdft/zncheck/relax/QM_MM_optimized.pdb
      atoms: [B:1:ZN, C:1:O2x]
      start: 2.15
      end: 4.00
      points: 9
      opt_maxiter: 300
      resume: true

  # ¶93: the attack distance is the one coordinate that degraded unrestrained
  # (3.47 -> 5.41 A over 500 ps), while the trajectory improved on its own
  # (79 -> 96 degrees). A harmonic distance restraint holds the radial
  # coordinate and leaves both angular ones free, so MD can keep rotating into
  # the Burgi-Dunitz window while the approach is held. Held at the distance the
  # input already has, not pulled to a chosen one. The Zn-carbonyl distance is
  # deliberately NOT restrained: for a mono-Zn B3 site it is not established
  # that the carbonyl coordinates the same zinc that carries the nucleophile,
  # and `constraint_exclude_residues: {C: [1]}` keeps the ligand out of the
  # automatic coordination set for the same reason.
  nac:
    stage: md
    inputs:
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]   # Zn-bound O -> beta-lactam carbonyl C
      nvt_time: 1000                       # 1 ns, per the ASH 2b protocol

  # ¶94: is the 1.79 A Zn-Gln93 contact that MM produced a real minimum on the
  # QM/MM surface, or an artefact held there by a barrier? Same test ¶53 ran on
  # Asp92 and ¶58 on the carbonyl. An optimisation alone cannot answer it - it
  # only reports the basin it started in - so pull the contact out and read the
  # profile. Needs a preprocess that put Gln93 in the QM region, which happens
  # automatically once it is inside `cutoff` of the metal.
  zngln:
    stage: scan
    inputs:
      pdb_file: protdft/qmmm/QM_MM_optimized.pdb
      atoms: [B:1:ZN, A:93:OE1]
      start: 1.80
      end: 4.20
      points: 9
      opt_maxiter: 300
      resume: true

  # The same run on a GPU. Measured on an H100 (¶99): 845 ns/day against
  # 2.3 ns/day on 4 CPU cores for this 49k-atom system, so minimisation, NPT
  # and 1 ns of NVT together are minutes rather than most of a day - and a
  # 10-50 ns equilibration becomes one job instead of nine. Kept separate from
  # `nac` so that section still runs on a CPU node; submit this one with
  # `-p gpu_cuda --qos=gpu --gres=gpu:1`.
  nacgpu:
    stage: md
    inputs:
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]   # Zn-bound O -> beta-lactam carbonyl C
      nvt_time: 1000
      platform: CUDA
      properties: {Precision: mixed}

  # 100 ns NVT, the literature equilibration length (¶92: Gervasoni 100 ns,
  # Guven 50, Lisa 10, Bahena-Mendez 10). About 4-5 h on an H100 at the rate
  # ¶100 measured, so one job.
  #
  # `traj_frequency` is raised from md's 500 deliberately. At 500 and a 4 fs
  # step a frame lands every 2 ps, which over 100 ns is 50,000 frames - and md
  # writes a raw and a reimaged copy, so about 60 GB. Scratch had 109 GB free
  # with three other projects writing into it, and an over-quota write fails
  # silently, leaving a file that looks finished. 5000 gives a frame every
  # 20 ps, 5,000 frames and roughly 7 GB, which is ample for equilibration
  # analysis; the last frame is what feeds QM/MM either way.
  #
  # The substrate restraint stays on throughout, as Gervasoni keep theirs
  # through 100 ns of NVT production. It also makes this the test of whether
  # the 80-degree attack angle rotates given 100x the time of ¶100's 1 ns -
  # which is the prediction of mine that run disproved.
  #
  # GPU is for `md` only. A QM/MM step is bottlenecked on xTB and copies
  # positions off the device each step, so qmmm/scan/neb/ts stay on CPU.
  naclong:
    stage: md
    inputs:
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
      nvt_time: 100000          # ps
      traj_frequency: 5000      # a frame every 20 ps
      platform: CUDA
      properties: {Precision: mixed}

  # ---- The ohH arm of the protonation test (¶112, M0, ¶114). ----
  #
  # The same site with the proton moved from Lys226 NZ onto the nucleophile, to
  # run the test VIM-2 used: equilibrate each protonation state and keep the one
  # that holds the active site the crystal shows (J Phys Chem B 2024, 128:12416,
  # PMC11664573 - 100 ps of QM/MM MD per state, judged by zinc coordination
  # against the crystal, not by an energy). Imhof decides protonation the same
  # way, by whether a state is a stable minimum: "all attempts to move protons
  # from Lys92 to the metaphosphate failed".
  #
  # Both arms start from `md_naclong`'s 100 ns lastframe - the frame `nacqm`
  # itself started from, at O01-C4x 3.33 A and 101 degrees - so they differ by
  # where one hydrogen sits and in nothing else. There is no fresh preprocess
  # and no second 100 ns. The lysH arm is `nacqm` (50 ps) continued by
  # `qmmm_nacarg` (50 ps), which loses the substrate entirely (¶111).
  #
  # Build the frame with
  #
  #   python make_water_nuc.py <naclong lastframe> ohH_start.pdb \
  #          --lys A:226 --floor 1.2
  #
  # which adds H04, renames the residue OH -> NUW, and removes Lys226's HZ3.
  # One hydrogen leaves the lysine and one joins the nucleophile, so the atom
  # count, the total charge and the QM charge of +3 are all unchanged. The
  # lysine keeps the name LYS deliberately: OpenMM matches LYN by bond graph,
  # whereas renaming it would make `build_qm_region` treat it as non-standard,
  # because this config's `amino_acids` list overrides mcube's default and omits
  # LYN, and put its whole backbone in the QM region.
  #
  # `--floor 1.2` is needed because the best clearance any water orientation
  # achieves at that oxygen is 1.71 A: the restrained equilibration held O01 at
  # 3.47 A from C4x and pressed the hydroxide against meropenem, so the position
  # has room for one hydrogen rather than two. Hence the minimisation below.

  # Minimisation only - no warm-up, no NPT, no production. `gentle` is off by
  # default and these two flags drop the rest, so the stage runs OpenMM_Opt and
  # stops, reporting the coordination sphere either side of it. That is also
  # the check we want: whether the zinc sphere survives adding the proton.
  # The restraints are the same as naclong's, so the nucleophile is held in
  # place while the clash relaxes rather than drifting.
  #
  # On CPU, unlike every other md section here, because 500 minimisation steps
  # take minutes either way and `gpu_cuda` quoted an 80 minute queue for them
  # (job 30698605, cancelled). A GPU earns its wait on nanoseconds of MD, not
  # on a minimisation.
  ohHmin:
    stage: md
    inputs:
      # Read against the config's directory, not `md_ohHmin_results/` where this
      # stage runs, so the path is the same one any other stage would write.
      pdb_file: md_naclong_results/ohH_start.pdb
      default_forcefields:
        - amber14/protein.ff14SB.xml
        - amber14/tip3p.xml
        - water_nuc.xml             # not hydroxide.xml: the nucleophile is a water
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
      skip_npt: true
      skip_nvt: true
      cores: 4                    # physical cores; -c 8 on an SMT node
      # Required here, and the reason ¶115 exists. This frame's atom order
      # differs from `processed_pdb`'s by one proton, so the indexed rows in
      # `preprocess.results.coordination` no longer name the atoms they were
      # measured on - applied blindly they restrained meropenem's C1x instead
      # of the zinc, which then lost His164 through an unrestrained
      # minimisation. This measures the coordination on this structure with
      # the same `metals`, `cutoff`, `donor_elements` and
      # `constraint_exclude_residues` preprocess used, so the restraints hold
      # the distances the frame actually has. The guard refuses the run
      # without it rather than restraining the wrong atoms again.
      coordination_redetect: true

  # 50 ps, then another 50 by changing `time` to 100 and resubmitting this same
  # section: `resume: true` restores ASH's state file and runs only the
  # remainder (¶109). `extra_qm_residues` is not optional here even though
  # Arg229 is also wanted for its own sake - without it `resolve_qm_region`
  # falls through to preprocess's saved atom *indices*, which are stale against
  # a frame where one hydrogen has moved. With it, the region is rebuilt from
  # residues on the actual file.
  ohH:
    stage: qmmm
    inputs:
      pdb_file: md_ohHmin_results/frag-minimized.pdb
      forcefields:
        - amber14/protein.ff14SB.xml
        - amber14/tip3p.xml
        - water_nuc.xml
        - preprocess_results/openff_MER.xml
      extra_qm_residues:
        A: [229]
      charge: 3                 # unchanged: the proton moved inside the QM region
      skip_equilibrate: false
      skip_optimize: true
      time: 50
      resume: true

  # ¶107: Arg229 is cationic and contacts the substrate in 89% of frames (¶29),
  # yet sat outside the QM region - while Lys226, which is *further* from both the
  # C3 carboxylate (4.80 vs 4.38 A) and the leaving nitrogen (6.93 vs 6.61 A), was
  # inside it. If the question is which cations stand in for the absent Zn2 in
  # stabilising the anionic nitrogen, that asymmetry cannot be defended.
  #
  # `extra_qm_residues` adds a residue for this stage only, rebuilt on the frame
  # given, so there is no preprocess re-run and no change of atom order - the new
  # trajectory stays comparable with `nacqm`'s. The QM charge goes +2 -> +3 with
  # the guanidinium, which has to be stated or the SCF converges to the wrong
  # species. `monitor` is deliberately absent: the qmmm stage resolves the key but
  # never reads it, so contacts are measured on the trajectory afterwards.
  nacarg:
    stage: qmmm
    inputs:
      pdb_file: protdft/nacqm/QM_MM_lastframe.pdb
      extra_qm_residues:
        A: [229]
      charge: 3
      skip_equilibrate: false    # qmmm.inputs sets true; without this there is no MD
      skip_optimize: true        # MD only; optimising is a separate decision

  # ---- ¶123. Back to Vina pose 2, with the carbonyl held on the zinc. ----
  #
  # Everything from `md_nac` onward ran on a pose that presents meropenem's
  # 6-alpha-hydroxyethyl O1x to the zinc (3.13 A) and leaves the beta-lactam
  # carbonyl at 5.43 A. `CSR_ligand`'s hand-picked pose - Vina pose 2, score
  # -5.624, identified by `site.py graft`'s own bond-graph match - presents the
  # carbonyl at **2.55 A**, against 2.53-2.63 A measured in L1's time-resolved
  # Michaelis complexes (¶121). That is the pose to go back to.
  #
  # BUILD, before either section runs. The old system cannot be reused as it
  # stands: it has His164 4.56 A off the metal, Asp92 bidentate on it, a
  # hydroxide carrying no hydrogen, an earlier meropenem variant with no O4x and
  # 41,371 atoms against this system's 49,424. So take the ligand placement only:
  #
  #   python site.py graft /scratch/user/uquadhik/CSR/CSR_ligand/meropenem.pdbqt \
  #          <docking-frame ligand.pdb> \
  #          /scratch/user/uquadhik/CSR/CSR_ligand/CSR_nontruncated_1metal.pdb \
  #          md_naclong_results/NVTtrajectory_lastframe.pdb 2
  #
  # which aligns on the residues within 12 A of the metal and writes pose 2 into
  # the equilibrated system, keeping this system's protein, waters, ion count and
  # atom naming. The reference ligand must be the docking-frame meropenem whose
  # graph matches the PDBQT; `preprocess_results/meropenem_fixed.pdb` does not
  # (graft refuses it rather than guessing atom identities, which is correct).
  #
  # Then **remove HOH485**. With the carbonyl inner-sphere the sphere is two His
  # + hydroxide + carbonyl, which is the four-coordinate canonical-equivalent
  # ¶41 defined; HOH485 would be a fifth. ¶34 showed that dropping its restraint
  # is not enough - the water stayed at 1.83 A - so it has to leave the
  # structure. It is the weakest ligand in the crystal anyway: in 6NC5 it bridges
  # ZN302 to the artefact ZN303 (¶40).
  #
  # Removing an atom renumbers the file, so `coordination_redetect: true` is
  # mandatory below, for the reason ¶115 records.

  # ===========================================================================
  # DO NOT RUN `subst` AS WRITTEN. It was submitted as job 30923516 on
  # 2026-10-29 and cancelled an hour in, for two reasons that the comment block
  # below does not know about. ¶130.
  #
  #   1. Its start structure carries the shell ¶120 condemned. `subst_start.pdb`
  #      descends from `md_naclong`'s last frame, where Asp92 OD1 sits on the
  #      metal at 1.99 A. No detection cutoff undoes an artefact already in the
  #      coordinates, and ¶120 costed the consequence: everything from `md_nac`
  #      onward re-run from a shell that matches the crystal.
  #
  #   2. Its Asp92 restraints reinstate ¶120's condition rather than correcting
  #      it. Holding OD2 at 2.80 A is holding a second-shell contact - the exact
  #      pair, at the exact distance, that ¶120 identified as the cause - and
  #      adding OD1 at 3.81 A to block the rotation asserts the carboxylate's
  #      ORIENTATION where May's single restraint asserted only a distance.
  #      That is more assumption, not less. ¶120's own conclusion is that
  #      Asp92 reaching Zn1 is a question to ask, not an assumption to restrain
  #      in, so the design that follows restrains NEITHER oxygen and sets the
  #      detection cutoff tight enough that neither is ever picked up.
  #
  # What replaces it: preprocess from the crystal with `cutoff: 2.5`, no Asp92
  # restraint, then the 100 ns MM. The reasoning below about the carbonyl and
  # the attack coordinate still holds and is worth keeping; the restraint list
  # is what does not.
  # ===========================================================================
  # `subst` - the 100 ns NVT for the `substituent_on_metal` hypothesis, which is
  # the only arrangement we have a structure for. ¶126/¶127.
  #
  # Build step:
  #   site.py graft $Q/meropenem.pdbqt ref_mer.pdb \
  #     $Q/CSR_nontruncated_1metal.pdb \
  #     md_naclong_results/NVTtrajectory_lastframe.pdb 2 \
  #     --ref-frame=system
  #   # ref_mer.pdb is chain C resid 1 of the system itself (51 atoms); the
  #   # docking-frame copy is one atom short, which is why --ref-frame=system
  #   # exists at all. Then remove HOH485 from the written pose-2 file and save
  #   # it as md_naclong_results/subst_start.pdb.
  #   site.py check md_naclong_results/subst_start.pdb --at=start \
  #     --hypothesis=substituent_on_metal      # must exit 0 before submitting
  #
  # The restraint list is deliberately short, and what is NOT in it matters:
  #
  #   * NOTHING on the carbonyl. This is the point. In this arrangement the
  #     carbonyl sits at 4.50 A and the attack geometry is satisfied anyway;
  #     restraining it would be assuming the rival hypothesis.
  #   * NOTHING on the attack coordinate. It arrives at 3.17 A and 106 degrees
  #     with no restraint, so the run can be allowed to test whether that
  #     survives 100 ns. A restraint here would make the trajectory unable to
  #     answer the question it is being run to answer.
  #
  # What IS restrained is one documented error and one measured distance:
  #
  #   * Asp92 pinned in BOTH oxygens, OD2 at 2.80 and OD1 at 3.81. OD1 is on
  #     the metal at 1.99 A in the grafted frame, which is ¶120's artefact, not
  #     a feature of the enzyme: Asp92 is BBL ¶120, a Zn2-site ligand, and in
  #     L1 it sits more than 4 A from Zn1 (¶121). Pulling it off is correcting
  #     a known error, not imposing a hypothesis - which is the distinction
  #     that the carbonyl restraint in `pose2` could not claim.
  #   * Zn-O1x held at 2.66 A, the value the structure already has, so the
  #     coordination that defines this hypothesis is not lost to drift before
  #     anything can be measured. Held where it is, not pulled to a chosen
  #     number (¶93).
  #
  # HOH485 is removed in the build step, so the sphere is 2 His + hydroxide +
  # O1x = four. `coordination_redetect: true` is mandatory because removing a
  # water renumbers the file (¶115), and preprocess's own 3.0 A cutoff would
  # otherwise re-detect Asp92 OD2 and restrain it alone, which is how ¶120
  # happened. The explicit pair above wins over a detected one (`md_restraints`).
  #
  # What this run decides, which is ¶124's question asked of our own system:
  # with the carbonyl off the metal and the attack line satisfied, is the
  # nucleophile the zinc-bound hydroxide (thermolysin/CPA) or a second,
  # non-metal-bound water (GOB-18)? `site.py joint` and `site.py acceptors` on
  # the trajectory answer it directly and need no new code. Cost ~3 h on one
  # H100 at the rate ¶100 measured. Run those BEFORE committing the 119 h of
  # QM/MM, which is what ¶119 said and what was not done.

  # One caution on the start check, which returned `accepted` and exit 0. The
  # coordination number is 4, but it is the WRONG four: the sphere at the 2.6 A
  # cutoff is hydroxide 1.86, Asp92 OD1 1.99, His88 2.22, His164 2.32 - and
  # O1x, at 2.66, is just outside it. So the criterion passed on a count while
  # the composition is still ¶120's. The restraints below are what swap OD1 out
  # for O1x over the run, and the `--at=reactant` check on the last frame is
  # what verifies that it happened. A count is not a composition; do not read
  # the start check as saying the sphere is right.
  # ---- substopt: relieve the graft's clash before 100 ns is spent on it (¶146)
  # ----
  #
  # `subst_start.pdb` was never optimised - it is a docked pose transplanted by
  # `site.py graft`. Measured now: five ligands (O01 1.86, Asp92 OD1 1.99,
  # His88 2.22, His164 2.32, O1x 2.66), carbonyl 4.50, attack 3.17 A at 106
  # degrees - and **the nucleophile has the substrate's H5x 1.19 A from its
  # oxygen**, which puts O1x and O01 about 2.1 A apart. That is a shared proton,
  # not a hydrogen bond, and MM cannot transfer it: the force field would hold
  # H5x on O1x while the geometry wants it on O01, and 100 ns of GPU would be
  # spent on a strained contact rather than on the pose.
  #
  # So: one QM/MM optimisation first, ~10-20 min, with the Zn-O1x contact held
  # at the 2.66 A the structure has (the hypothesis, held where it is, not
  # pulled - ¶93) and **nothing on Asp92**, since the question of where the
  # carboxylate goes is the one we are trying to measure. It answers three
  # things cheaply: whether the proton settles on O01 or on O1x, whether O1x
  # stays on the metal when the rest of the site relaxes, and whether the 106
  # degree attack geometry survives contact with a real Hamiltonian.
  substopt:
    stage: qmmm
    inputs:
      pdb_file: md_naclong_results/subst_start.pdb
      skip_equilibrate: true
      opt_maxiter: 300
      opt_constraints:
        - [B:1:ZN, C:1:O1x, 2.66]

  # ---- subst, with the restraint list the new rule gives it (¶145/¶146) ----
  #
  # Restrain what is within coordination range, at the distance it has in the
  # crystal (user, 2026-10-30). Measured in 6NC5 ZN302: His87 NE2 2.22,
  # His163 NE2 2.09, HOH485 1.90, HOH493 2.14 - and **Asp91 at 4.20/4.22 A**,
  # nowhere near coordination range (¶145). So Asp92 gets a restraint at its
  # crystal distance rather than none: the grafted structure has OD1 at 1.99 A,
  # which is ¶120's artefact, and leaving it unrestrained is what put it there.
  # Both oxygens are named, at 4.22 and 4.20, so no orientation is asserted -
  # ¶130's objection to the old list, which held OD2 at 2.80 and OD1 at 3.81,
  # does not apply to two equal distances.
  #
  # The hydroxide is held where it is, with no distance given, NOT at the
  # crystal's 2.14: in 6NC5 HOH493 bridges two zincs, and that is why it is
  # long. A terminal hydroxide on a mono-zinc site belongs at 1.85-1.95, which
  # is what this structure has (1.86). **This is the one place a crystal
  # distance is not transferable, and it is a choice, not a measurement.**
  #
  # HOH485 was removed in the build step, so O1x takes its position and the
  # sphere is 2 His + hydroxide + O1x = four, which is the only vacancy the
  # crystal leaves (¶145).
  #
  # Repoint `pdb_file` at substopt's `QM_MM_optimized.pdb` once that run
  # finishes; sections.py refuses a structure that does not exist yet, so this
  # still names the unoptimised graft.
  subst:
    stage: md
    inputs:
      pdb_file: md_naclong_results/subst_start.pdb
      coordination_redetect: true
      restraints:
        - [B:1:ZN, A:92:OD1, 4.22]     # crystal, 6NC5 ZN302-Asp91 OD1
        - [B:1:ZN, A:92:OD2, 4.20]     # crystal, 6NC5 ZN302-Asp91 OD2
        - [B:1:ZN, A:88:NE2, 2.22]     # crystal His87
        - [B:1:ZN, A:164:NE2, 2.09]    # crystal His163
        - [B:1:ZN, C:2:O01]            # held where it is; see above
        - [B:1:ZN, C:1:O1x, 2.66]
      nvt_time: 100000          # ps; ~3 h on an H100 at the rate ¶100 measured
      traj_frequency: 5000
      platform: CUDA
      properties: {Precision: mixed}

  # ===========================================================================
  # `wt100` - the rebuild. ¶120 diagnosed the wrong zinc sphere, prescribed the
  # fix in its closing paragraph, and the fix was never applied (¶130); every
  # md section above this line was built on a start structure or a restraint set
  # that carries the artefact. This is the first run that does not.
  #
  # Three changes, and nothing else differs from `naclong`:
  #
  #   1. **It starts from the pre-MM structure, not from an MM frame.**
  #      `preprocess_results/finalsystem.pdb` measures HOH 1.90, His164 2.09,
  #      hydroxide O01 2.14, His88 2.22, Asp92 OD2 2.80, mer O1x 3.13 - which
  #      is 6NC5's ZN302 sphere with Asp92 correctly in the second shell. Every
  #      later frame has OD1 at 1.99-2.07 A, and no detection cutoff undoes an
  #      artefact already in the coordinates.
  # **FALSIFIED BY MEASUREMENT (¶177).** Point 2 below describes what the
  # DETECTOR does and was read as a statement about what the TRAJECTORY does.
  # Over this run's 100 ns the zinc is six-coordinate in 4995 of 5000 frames,
  # Asp92 OD2 bound at 2.07 A mean in 100% of them and OD1 bidentate in 56.7%.
  # Excluding Asp92 from the restraint list did not keep it in the second
  # shell; it removed the only thing that could have. Left in place because it
  # is the reasoning the run was submitted on.
  #
  #   2. **The detection cutoff is 2.5 A, set in `preprocess.inputs.cutoff` in
  #      the run directory's config.yaml.** At 3.0 (the default this project
  #      ran at) Asp92 OD2 is inside the sphere and gets a restraint, which is
  #      exactly how ¶120 happened. 2.5 is the longest Zn-O distance that is
  #      still a bond (`LIGAND_MAX`); it keeps the crystal's four and excludes
  #      the 2.80 contact. This is not a cutoff chosen to produce an answer -
  #      it is the same number `preprocess.py` now warns against exceeding.
  #   3. **No configured restraints at all.** Not on Asp92, which is the error;
  #      and not on the substrate either, because the carbonyl restraint was
  #      what held meropenem against a saturated metal. The restraints that do
  #      act are the ones redetection builds from the structure itself - two
  #      histidines, the hydroxide and HOH485 - which is mcube holding what the
  #      crystal already has, and is the whole design.
  #
  # `coordination_redetect: true` is what makes 1 and 2 take effect: it applies
  # the preprocess rule to the file in front of the stage rather than replaying
  # the numbers recorded in October. `coordination_source` in the results records
  # that it happened.
  #
  # What it decides: whether the crystal's four-coordinate shell is stable over
  # 100 ns of MM, which is the premise every mechanism in the plan rests on and
  # which has never been tested on a correct sphere. Read it with
  # `site.py shell` for occupancy - a count is not a composition (¶129) - and
  # `site.py check --at=reactant` on the last frame. Cost ~3.4 h on one fast
  # GPU node at the 0.49 ns/min ¶131 measured. The substrate is unrestrained,
  # so expect it to drift off the attack line as it did in ¶93; that is a
  # separate question and this run is not the test of it.
  wt100:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      nvt_time: 100000          # ps
      traj_frequency: 5000      # a frame every 20 ps; ~7 GB, see `naclong`
      platform: CUDA
      properties: {Precision: mixed}

  # ===========================================================================
  # ---- wt100b: the same run with the substrate held (¶134). ----
  #
  # wt100 restrained nothing but the four detected zinc donors, and the
  # substrate left: mer O1x outside 2.6 A in every one of 5,000 frames, the
  # carbonyl 7.80 A out by the end. So wt100's occupancy is of a site with no
  # substrate in it, and `aspin` has no Michaelis start to scan.
  #
  # This adds naclong's substrate restraint - the one Gervasoni keep through
  # 100 ns (¶92) - and nothing else. Asp92 is still free, which is the whole
  # point of the wt100 rebuild, so the comparison with wt100 is clean: one
  # restraint differs, and it is not on the zinc.
  wt100b:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
      nvt_time: 100000          # ps; 3 h 12 m on a full H100 (¶134)
      traj_frequency: 5000      # a frame every 20 ps; ~3 GB imaged
      platform: CUDA
      properties: {Precision: mixed}

  # `aspout` / `aspin` - is Asp92 on the zinc a basin, or the basin our scans
  # started in? (¶133)
  #
  # Where this stands: MM at 100 ns puts Asp92 OD1 on the metal with nothing
  # restraining it (¶102); 25 ps of unconstrained GFN2-xTB QM/MM MD from a free
  # start pulls OD2 from 2.80 to 2.09 A (¶51); and DFT is 1.6x steeper than xTB
  # along that coordinate, 9.1 against 5.7 kcal/mol to reach 2.80 A, so it is
  # not a semi-empirical artefact (¶58, ¶60). The crystal has it off the metal
  # at 2.80 A (6NC5 ZN302). Every level of theory we have run disagrees with the
  # structure, and that - not the restraints - is the open problem.
  #
  # The one objection none of those runs answers is ¶94's: a relaxed scan reports
  # the basin it started in, and `scan_znasp` and `scan_znco` both started bound.
  # So run the same coordinate from both ends and compare the curves.
  #
  #   aspout   bound start,  1.90 -> 3.60 A
  #   aspin    free start,   3.60 -> 1.90 A
  #
  # Curves that lie on each other mean the well near 2.0 A is real on this
  # surface, and the question becomes why the crystal disagrees - which is what
  # ¶133's hypothesis is for. Curves that separate mean the earlier scans were
  # measuring their own start and the preference is hysteresis.
  #
  # **This is not a free energy, and a free energy is what would settle it.**
  # **[SUPERSEDED 2026-11-05: `coordinate: distance` now EXISTS** - `umbrella.py`
  # has `COORDINATES = ("z", "distance")`, `cv_pair`, `distance_values`, a
  # distance branch in `bias_force` and `exclude_pair` on the coordination
  # restraints, and `docs/umbrella.md` documents it. So a two-atom PMF is no
  # longer blocked by the library. It is blocked by its seeds: see `aspcg` and
  # `asp` below, and note that THESE scans cannot supply them.]
  #
  # `extra_qm_residues: {A: [93]}` puts Gln93 in the QM region. Arg90 and Lys226
  # are already in it (preprocess `extra_qm_residues`), but the **Q** of RQK was
  # not, and the hypothesis under test is that RQK's charge is what holds Asp92
  # off the metal in place of the absent Zn2 - so all three cations and the
  # glutamine have to be described quantum-mechanically or the test is rigged
  # against itself. Gln is neutral, so the QM charge stays +3. It goes here
  # rather than in preprocess because this directory does not re-run preprocess:
  # `resolve_qm_region` adds it to the saved region and rebuilds on the section's
  # own pdb_file.
  #
  # The first attempt at this arm (job 31016878) was cancelled at point 0 of 8
  # after 4 h 39 m and 120 geomeTRIC steps, converged by no criterion (¶137).
  # The scan bond was held fine; what never satisfied was the rigid-water block,
  # because `scan` held the active-region MM waters unconditionally and a scan
  # always sets its own bond, so geomeTRIC got the whole block as `$set` - and a
  # `$set` water distance is a convergence criterion that rigid TIP3P cannot
  # meet (0.069 A against `convergence_cmax` 0.01). Fixed in the library rather
  # than here: `rigid_water` now defaults to **off** for `qmmm`, `scan` and `ts`,
  # which is what it should always have been for a QM/MM gradient stage, and
  # `scan` honours it at all (it had no such option). The `md` stage's OpenMM
  # `rigidWater` is untouched - that is what buys the long NVT timestep.
  aspout:
    stage: scan
    inputs:
      # `../` and not an absolute path, which is what let this survive the
      # 2026-11-03 move: the run directories went into `CSR/` together, so a
      # sibling is still a sibling. It resolves against the run directory
      # this section is used from, which for `aspout` is the wt arm.
      pdb_file: ../CSR_nac/md_naclong_results/NVTtrajectory_lastframe_imaged.pdb
      atoms: [B:1:ZN, A:92:OD1]
      start: 1.90
      end: 3.60
      points: 9
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}
      resume: true

  # The reverse arm. **Run it only after `aspout` finishes**, because its start
  # is aspout's own last point: Zn-OD1 at 3.60 A in the same box, same waters,
  # same substrate. That is the hysteresis test proper - the same path walked
  # back - and it is also the only free-Asp92 start that exists. The two MD
  # candidates are both out: md_wt100's last frame has no substrate in the site
  # (¶134, O1x outside 2.6 A in every frame, carbonyl 7.80 A out, `site.py
  # check` rejects it), and md_wt100b kept the substrate but closed Asp92 right
  # down - OD1 at 2.15 A in 100% of 5,000 frames, bidentate, six-coordinate
  # throughout (¶138) - so neither offers an Asp92 that is off the metal.
  #
  # If the two curves lie on each other the well near 2.0 A is real on this
  # surface; if they separate, every single-direction scan in the log was
  # reporting its start (¶94) and only a free energy can settle it.
  aspin:
    stage: scan
    inputs:
      pdb_file: protdft/scan_aspout/scan_08.pdb
      atoms: [B:1:ZN, A:92:OD1]
      start: 3.60
      end: 1.90
      points: 9
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}
      resume: true

  # ---- michaelis2d: can the carbonyl reach the zinc, and what does Asp92 do
  # when it tries? (¶144) ----
  #
  # Two questions neither the MD nor the 1D scans can answer, because no
  # structure we have ever had the substrate on the metal:
  #   1. does the substrate coordinate the zinc in the Michaelis complex?
  #   2. is Asp92 coordinated when it does?
  # Every "Asp92 is on the metal" result in this log (¶102, ¶120, ¶134, ¶138,
  # ¶140, ¶143) comes from a state where the substrate is NOT coordinated, so
  # none of them answers question 2 as asked. And the crystal (6NC5) has Asp92
  # OFF at 2.80 A, so the restrained-MD answer is not admissible either: MD
  # cannot be trusted for coordination, and a contact in coordination range
  # should be restrained at its crystal distance rather than at whatever the
  # force field detects.
  #
  # So make the missing state instead of looking for it. Rows are Zn-Asp92 OD1
  # (1.90 -> 3.60, five values spanning bound to the four-coordinate site);
  # within each row the carbonyl is pulled in, Zn-O2x 5.00 -> 2.10 in nine
  # steps, snaking so each point starts from an adjacent one. 45 points at
  # ~8.5 min (¶140's measured rate) is about 6.5 h on 8 cores.
  #
  # What the grid decides, whatever it says:
  #   - a row where the carbonyl reaches ~2.1 A at modest cost says the
  #     substrate CAN coordinate, and the row it happens in says what Asp92
  #     has to do for that;
  #   - if only the Asp92-out rows allow it, the carboxylate swing is part of
  #     the reaction coordinate and belongs INSIDE the NEB, not fixed at one
  #     end of it;
  #   - if no row allows it, `carbonyl_on_metal` is wrong for CSR-1 and the
  #     hypothesis in site.yaml has to change, not the structures.
  # Either way both NEB endpoints come out of one surface, which is what
  # `step1` needs and does not have - neither of its endpoint files exists.
  #
  # **Starts from the FOUR-coordinate structure, not the Asp92-bound one**
  # (user, 2026-10-30: "there's no point starting from a structure where Asp92
  # is overcoordinated, as that defeats the point we're trying to measure").
  # `scan_aspin/scan_00.pdb` is aspout's 3.60 A end point re-optimised: two
  # histidines, hydroxide 1.84 and HOH485 2.01, Asp92 at 3.60/4.47, substrate
  # present with O1x 3.89 and the carbonyl 4.69. Waters already relaxed under
  # the flexible-water model (¶142), so no rigid-start strain either.
  #
  # Rows therefore run OUTWARD-IN, 3.60 -> 1.90: the first row is the
  # four-coordinate site with a free face, and Asp92 is only brought back onto
  # the metal in later rows. The previous submission (31154229) was cancelled
  # for starting at 1.90 A instead.
  michaelis2d:
    stage: scan
    inputs:
      pdb_file: protdft/scan_aspin/scan_00.pdb
      atoms: [B:1:ZN, C:1:O2x]      # the carbonyl, onto the metal
      start: 4.70
      end: 2.10
      points: 9
      atoms2: [B:1:ZN, A:92:OD1]    # Asp92's own distance, as the rows
      start2: 3.60
      end2: 1.90
      points2: 5
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}  # as in aspout/aspin, so the surfaces match
      monitor:
        - [B:1:ZN, A:92:OD2]        # does the carboxylate go bidentate
        - [B:1:ZN, C:1:O1x]         # the hydroxyethyl O, the other candidate
                                    # ligand - 3.89 A here, and the closest
                                    # substrate atom in every run (¶144)
        - [B:1:ZN, D:1:O]           # does the water leave to make room
        - [C:2:O01, C:1:C4x]        # the attack distance
      resume: true

  # ---- rwoff / rwon: what did holding the waters cost? (¶141) ----
  #
  # Every QM/MM gradient run in this project before ¶139 held the active-region
  # MM waters rigid, because that was the default and no config ever set the
  # key. Most of those runs converged anyway (¶141's table), so the question
  # left over is not whether they finished but whether the held waters moved
  # their energies.
  #
  # One variable, one structure: both sections re-optimise `aspout`'s own
  # converged 2.75 A point with the same Zn-Asp92 OD1 constraint, the same QM
  # region and the same active region - the active region is re-derived from
  # `pdb_file`, so it is identical between the two and NOT identical to the
  # scan's, which is why `rwoff` is run as the control rather than comparing
  # straight to the scan's -447.32259831 Eh. `rwon - rwoff` is the number.
  #
  # Agreement to a few tenths of a kcal/mol closes ¶141: every converged result
  # in the log stands as computed. A larger gap is the size of the correction,
  # and it would apply to every pre-¶139 scan point and constrained
  # optimisation. About 10 minutes each on 8 cores.
  rwoff:
    stage: qmmm
    inputs:
      pdb_file: protdft/scan_aspout/scan_04.pdb
      skip_equilibrate: true
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}
      opt_constraints:
        - [B:1:ZN, A:92:OD1, 2.75]
      rigid_water: false         # the ¶139 default, stated for the record

  rwon:
    stage: qmmm
    inputs:
      pdb_file: protdft/scan_aspout/scan_04.pdb
      skip_equilibrate: true
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}
      opt_constraints:
        - [B:1:ZN, A:92:OD1, 2.75]
      rigid_water: true          # what every pre-¶139 run did

  # ===========================================================================
  # DO NOT RUN `pose2` AS WRITTEN. ¶126 (2026-10-29) disproved its premise.
  #
  # Pose 2 as docked has NOTHING within 7.2 A of the zinc - it is the furthest
  # of the nine poses from the metal - and grafted into four different systems
  # its carbonyl sits 4.26-4.82 A away, including one where the docking
  # receptor aligns onto the system backbone at 0.00 A RMSD. The 2.55 A below
  # is not a property of the pose: it is what the MAY RUN'S OWN RESTRAINT
  # produced, measured in `CSR_ligand/preprocess_results/finalsystem.pdb`,
  # which ¶123 had already rejected for its metal site (Asp92 bidentate,
  # His164 off the metal entirely).
  #
  # `site.py check --at=start` REJECTS the grafted structure (exit 1) on the
  # closest-oxygen criterion, the carbonyl distance and the nucleophile
  # distance. It also PASSES the attack distance at 3.17 A and the angle at
  # 106 degrees - inside the Burgi-Dunitz window ¶34 never reached in 791
  # frames - which happens *because* the carbonyl is off the metal and the
  # 6-alpha-hydroxyethyl O1x holds the site at 2.66 A instead.
  #
  # Pulling the carbonyl 4.50 -> 2.55 A would rebuild ¶34's failed geometry and
  # destroy that 106 degrees. The section is kept unaltered as the record of
  # what was planned; which Michaelis complex to equilibrate is the user's
  # decision and is stated at the end of ¶126.
  # ===========================================================================

  pose2:                       # the constrained 100 ns NVT equilibration
    stage: md
    inputs:
      pdb_file: md_naclong_results/pose2_start.pdb
      coordination_redetect: true
      restraints:
        # [SUPERSEDED - ¶126] "the distance pose 2 already has" is false: pose 2
        # has nothing within 7.2 A of the metal, and 2.55 A is the previous
        # restraint's own output rather than a measurement of anything.
        - [B:1:ZN, C:1:O2x, 2.55]
        # Asp92 pinned in BOTH oxygens. ¶120: holding OD2 alone at 2.80 let OD1,
        # which nothing watched, rotate onto the metal (3.81 -> 1.99 A) and take
        # the coordination position the carbonyl needs. Both values are the
        # crystal-derived start's own.
        - [B:1:ZN, A:92:OD2, 2.80]
        - [B:1:ZN, A:92:OD1, 3.81]
        # The attack coordinate, held where the built structure has it. Pose 2
        # starts at O01-C4x 3.81 A; set this to whatever `site.py sphere` reports
        # for the grafted frame rather than to a number chosen here.
        - [C:2:O01, C:1:C4x]
      nvt_time: 100000          # ps; ~3 h on an H100 at the rate ¶100 measured
      traj_frequency: 5000      # a frame every 20 ps, ~7 GB (see `naclong`)
      platform: CUDA
      properties: {Precision: mixed}

  # 300 ps of QM/MM MD from that equilibration. At the 1.427 s/step ¶119
  # measured, 300 ps of 1 fs steps is about 119 h of wall time, so this runs as
  # six resumed jobs: set `time` to 50, then 100, 150 ... and resubmit the same
  # section, which is the ¶109 pattern `resume: true` exists for.
  #
  # `charge` is NOT set here on purpose. It depends on which residues the region
  # picks up on the new structure, and asserting the wrong value converges the
  # SCF to the wrong species. Read it off the preprocess/QM-region report for the
  # grafted frame and set it before the first submission.
  pose2qm:
    stage: qmmm
    inputs:
      pdb_file: md_pose2_results/NVTtrajectory_lastframe.pdb
      extra_qm_residues:
        A: [229]
      skip_equilibrate: false
      skip_optimize: true
      time: 50                  # raise to 100, 150 ... 300 and resubmit
      resume: true
      cores: 4                  # xTB saturates ~4 threads; CPU only
  # ---- Which protonation state is the reactant? Blocks every barrier. ----
  #
  # ¶96: starting from Lys226-H+ with a Zn-bound hydroxide, a QM/MM optimisation
  # moved the proton to O01 on its own, leaving Zn-OH2 and a neutral Lys226. So
  # "the Michaelis complex" is presently two different chemical species and a
  # barrier computed from either is undefined until one is chosen.
  #
  # These differ from `cleanR_lysH` / `cleanR_ohH` (¶42) in what they do NOT
  # constrain. Those hold Zn-Asp92 at 2.80 A and Zn-carbonyl at 2.90 A; the
  # first is stale - a free optimisation puts Asp92 at 2.17 - and the second
  # asserts the carbonyl coordinates this zinc, which for a mono-Zn B3 site is
  # not established and which we declined to impose in `md_nac`. Both sit next
  # to O01 and so bias the proton transfer being measured. Here the only
  # constraint is the one that defines the protonation state; everything else
  # relaxes, so the two runs differ in one thing and are comparable.
  #
  # Same total charge either way (the proton moves inside the QM region), so the
  # energies are directly comparable. Score both with `sp_dft` afterwards rather
  # than trusting xTB to order proton affinities. Then confirm the winner is a
  # minimum before building any path from it.

  protH_lys:                   # proton on Lys226 NZ: nucleophile is hydroxide
    stage: qmmm
    inputs:
      skip_equilibrate: true
      opt_maxiter: 600
      opt_constraints:
        - [A:226:NZ, A:226:HZ1, 1.03]
      monitor:
        - [B:1:ZN, C:2:O01]
        - [B:1:ZN, A:92:OD2]
        - [C:2:O01, C:1:C4x]

  protH_oh:                    # proton on O01: nucleophile is water, Lys226 neutral
    stage: qmmm
    inputs:
      skip_equilibrate: true
      opt_maxiter: 600
      opt_constraints:
        - [C:2:O01, A:226:HZ1, 0.98]
      monitor:
        - [B:1:ZN, C:2:O01]
        - [B:1:ZN, A:92:OD2]
        - [C:2:O01, C:1:C4x]

  # ---- Reaction path. One NEB per elementary step, never one path for both. ----
  #
  # Hydrolysis is at least two elementary steps, and a single NEB spanning both
  # puts two barriers on one path: NEB-CI returns one saddle, so the other is
  # simply not found. Each step therefore gets its own scan (to build its
  # product in the reactant's box), its own NEB, and its own TS.
  #
  #   step 1  nucleophilic attack   O01 ... C4x   ->  tetrahedral intermediate
  #   step 2  ring opening          C4x -- N1x    ->  opened product
  #
  # Endpoints must be one system in two geometries - `neb` refuses a product
  # whose atom order differs, and `scan` is what guarantees it, because it
  # writes every point through the reactant's own MM topology.
  #
  # Which Michaelis complex these start from is still being settled, so neither
  # section fixes `pdb_file` yet: set it here before running one. Left unset,
  # `scan` falls back to `qmmm.results.optimized_pdb` and pins whatever that was
  # into the section, so the config still records which structure produced the
  # path - but naming it is how the choice gets reviewed rather than inherited.

  attack:                      # step 1 product: drive the nucleophile in
    stage: scan
    inputs:
      atoms: [C:2:O01, C:1:C4x]
      end: 1.45                # C-O single bond; `start` defaults to the current distance
      points: 16
      monitor:
        - [B:1:ZN, C:1:O2x]    # does the carbonyl engage the zinc as the carbon rehybridises?
        - [C:1:C4x, C:1:N1x]   # the bond that breaks in step 2 should lengthen here
        - [A:226:NZ, C:2:O01]  # Lys226 as proton donor or acceptor (question 1)
      opt_maxiter: 300
      resume: true

  ringopen:                    # step 2 product: break C-N from the intermediate
    stage: scan
    inputs:
      atoms: [C:1:C4x, C:1:N1x]
      start: 1.39              # as measured in the optimised complex
      end: 2.80
      points: 12
      monitor:
        - [A:226:NZ, C:1:N1x]  # who protonates the leaving nitrogen
        - [A:92:OD2, C:1:N1x]
        - [B:1:ZN, C:1:N1x]    # a mono-Zn site has no Zn2 to stabilise the anion
      opt_maxiter: 300
      resume: true

  # Both endpoints are keys here, not arguments: the two minima are the step the
  # barrier belongs to, so a path given on the command line would leave nothing
  # recording which barrier was computed. The reactant is the optimised Michaelis
  # complex; the product is the corresponding scan's last point, which is in the
  # reactant's own atom order because `scan` writes every point through the
  # reactant's MM topology. Fill both in from the runs that produced them.
  #
  # The active region is not set here and cannot be copied from the endpoints:
  # each run derives it from `actradius`/`actregion_origin` on its own structure
  # and records the list it used. Check those counts match across the two
  # endpoints and the NEB - `actradius` is measured per structure, so the same
  # radius can give slightly different regions on two geometries, and energies
  # over different sets of movable atoms are not comparable.
  step1:                       # NEB over the attack
    stage: neb
    inputs:
      reactant_pdb: protdft/qmmm_protH_oh/QM_MM_optimized.pdb
      product_pdb: protdft/scan_attack/scan_15.pdb
      images: 12
      method: nebts            # NEB-CI then a geomeTRIC TS optimisation of the climbing image
      interpolation: idpp

  step2:
    stage: neb
    inputs:
      reactant_pdb: protdft/scan_attack/scan_15.pdb
      product_pdb: protdft/scan_ringopen/scan_11.pdb
      images: 12
      method: nebts
      interpolation: idpp

  # Keys are bare names: sections.py writes each as <stage>_<name>, so a key
  # cannot be shared by two stages - `step1` is the NEB's, and the matching TS
  # section is `saddle1` rather than `step1` for that reason alone.
  #
  # A saddle is only a transition state if it has exactly one imaginary mode and
  # that mode is the reaction coordinate. `ts` checks both and then runs an IRC
  # in each direction, which is what establishes the saddle connects the two
  # minima the NEB was built from rather than some other pair.
  saddle1:
    stage: ts
    inputs:
      pdb_file: protdft/neb_step1/saddlepoint.pdb
      hessian_atoms: [C:2:O01, C:1:C4x, C:1:O2x, C:1:N1x, B:1:ZN]
      monitor:
        - [C:2:O01, C:1:C4x]
        - [C:1:C4x, C:1:N1x]
      tsopt: true
      freq: true
      irc_method: mode

  saddle2:
    stage: ts
    inputs:
      pdb_file: protdft/neb_step2/saddlepoint.pdb
      hessian_atoms: [C:1:C4x, C:1:N1x, A:226:NZ, B:1:ZN]
      monitor:
        - [C:1:C4x, C:1:N1x]
        - [A:226:NZ, C:1:N1x]
      tsopt: true
      freq: true
      irc_method: mode

  # ---- the charge-deletion pair (¶152) ----
  #
  # Mulholland's decomposition: zero a residue's MM point charges, recompute the
  # energy on an UNCHANGED geometry, and the difference is that residue's
  # electrostatic contribution. `zero_charges_qm_only` deletes the charges the
  # QM code is handed and leaves the MM system's own electrostatics alone, so
  # the difference is the QM-MM interaction - the quantity that stays meaningful
  # when two structures are differenced, because the MM-MM part would otherwise
  # change with every atom that moved between them.
  #
  # These two run the SAME structure with the SAME settings and differ in one
  # key, which is the only way the difference means anything. Arg229 first: it
  # holds the substrate carboxylate at 3.62 +/- 0.04 A across all 45 grid points
  # and both trajectories (¶150), it is in MM, and it is the residue the paper
  # has to put a number on.
  #
  # The first run also settles an open question in the library: whether the
  # detection in `charge_sequences` finds where this ASH build keeps its point
  # charges. Check `pointcharge_lists` and `verified_after_run` in the results,
  # and that the two energies actually differ.
  # ---- The hydrolysed-product complex, grafted from SMB-1's 5AXO (¶156, ¶159)
  # and run in `CSR_prod`. Both of these are the reactant's protocol with
  # nothing added: `wt100`'s 100 ns and the 50 ps QM/MM MD that `ohH` and
  # `nacarg` ran, because the point of the product run is to be comparable.
  #
  # **No substrate restraint, deliberately.** Measured in 5AXO against ZN301 -
  # the Zn1-site metal our single zinc occupies - the closest product atom is
  # 3.41 A. Everything that binds the product there binds **Zn2**, which CSR-1
  # does not have, so a restraint would transplant a Zn2 bond onto a Zn1 metal.
  # `coordination_redetect` picks up the protein shell at the crystal distances
  # the start structure already carries (His88 2.22, His164 2.09, HOH485 1.90,
  # and the water that replaced the hydroxide at 2.14), and
  # `constraint_exclude_residues: {C: [1]}` keeps the ligand out of detection.
  prod100:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      nvt_time: 100000          # ps; ~3 h on a full H100 (¶134, ¶138)
      traj_frequency: 5000      # a frame every 20 ps
      platform: CUDA
      properties: {Precision: mixed}

  # The coordination sphere over the whole 100 ns, by the same rule that built
  # the restraints: `mcube postprocess` reads `metals`, `cutoff` and
  # `donor_elements` from `preprocess.inputs`, applies the minimum image, and
  # saves what it measured into this section's `results` - so the config records
  # the analysis as well as the run. This replaces `site.py shell`, which was
  # outside the package and took its cutoff from a command line (¶167).
  #
  # `per_residue: false` because a carboxylate binding with both oxygens is a
  # different sphere from one binding with one, and keying by residue hides
  # exactly that - ¶166 measured Asp92 monodentate at 2.02 in `md_wt100` and
  # bidentate at 2.06/2.12 in `md_wt100b`.
  prodpost:
    stage: postprocess
    inputs:
      md_section: md_prod100
      # **Given explicitly because `md_prod100` FAILED.** Job 31327774 died at
      # 34.14 ns of 100 with `Particle coordinate is NaN`, so `md`'s results
      # never got a `trajfile` or a `lastframe` to read them from - but 1.0 GB
      # of trajectory up to the crash exists, and whether the zinc held through
      # those 34 ns is exactly the question that gates the arm. The topology is
      # the trajectory's OWN first frame, not `finalsystem.pdb`: postprocess
      # refuses a topology whose atoms disagree with the frames, and the first
      # frame is by definition the structure the trajectory was produced from
      # (¶171).
      pdb_file: md_prod100_results/NVTtrajectory_firstframe.pdb
      trajectory: md_prod100_results/NVTtrajectory.dcd
      # Three frames back from the crash (60 ps), as the restart structure. The
      # last frame is the one nearest whatever went wrong, so it is the one not
      # to use; 60 ps is far enough to be clear of it and short enough that
      # nothing else about the system has changed (¶172).
      export_frames: [-3]
      export_prefix: restart
      # Checked on that exported frame, because it is what the restart will
      # actually be given. Hydrogens are the one part no crystal structure
      # supplies, and nothing downstream refuses a wrongly placed one.
      hydrogens: true
      coordination:
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      # **These selectors use the names in `finalsystem.pdb`, which are NOT the
      # names in the ligand file the graft produced.** OpenFF's parameterizer
      # re-derives atom names from the SDF, so `hyd_crystal.pdb` -> `hyd.pdb`
      # renamed 15 of 53 atoms: O5x->O4x, O6x->O5x, **O01->O6x**, and the
      # hydrogens throughout. Verified by matching coordinates (all 53 within
      # 0.05 A) and cross-checked against two shell measurements: ¶159 measured
      # our O6x/O5x at 2.92/2.94 from the zinc, and the final system reports
      # O5x/O4x at the same two distances (¶168).
      #
      # So the nucleophile oxygen - the hydroxide the product absorbed, `O01`
      # everywhere in this log - is **O6x** in the system that is simulated.
      # Pairs are named by atom rather than by chemical role where the role has
      # not been re-derived from the product's connectivity; the roles in the
      # reactant's `monitor` above do not carry over.
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-Asp92 CG: [B:1:ZN, A:92:CG]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-HOH C1: [B:1:ZN, C:1:O]
        Zn-HOH C2: [B:1:ZN, C:2:O]
        Zn-hyd O4x: [B:1:ZN, D:1:O4x]
        Zn-hyd O5x: [B:1:ZN, D:1:O5x]
        Zn-hyd O6x: [B:1:ZN, D:1:O6x]
        Zn-hyd O2x: [B:1:ZN, D:1:O2x]
        Zn-hyd N1x: [B:1:ZN, D:1:N1x]
        C4x-N1x: [D:1:C4x, D:1:N1x]
        O6x-C4x: [D:1:O6x, D:1:C4x]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]
        Gln93 NE2-hyd O2x: [A:93:NE2, D:1:O2x]
        Arg90 NH1-hyd O1x: [A:90:NH1, D:1:O1x]
        Arg90 NH2-hyd O1x: [A:90:NH2, D:1:O1x]
        Lys226 NZ-hyd O3x: [A:226:NZ, D:1:O3x]
        Lys226 NZ-hyd O6x: [A:226:NZ, D:1:O6x]
        Arg229 NH1-hyd O3x: [A:229:NH1, D:1:O3x]
        Arg229 NH2-hyd O4x: [A:229:NH2, D:1:O4x]
        Ser186 OG-hyd O4x: [A:186:OG, D:1:O4x]

  # 50 ps of GFN2-xTB QM/MM MD from that trajectory's last frame. `charge` is
  # inherited at +2 and that is correct for the product as well as the
  # reactant: the hydroxide (-1) is gone and the ligand is -1 in its place.
  prodqm:
    stage: qmmm
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    require:
      unset: [restraints, opt_constraints, constraints, qm_engine]
      equals: {charge: 0, rigid_water: false, skip_equilibrate: false,
               skip_optimize: true, time: 50}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      # **No Gln93 here, deliberately** (user, 2026-11-02): "glutamine was left
      # out deliberately because it's probably not involved/functional as it's
      # neutral and far away from everything". It is the Q of RQK by name, but
      # the triad's mechanistic lever is charge, and a neutral amide several
      # angstroms out has none - so it is MM like the rest of the second shell,
      # and the QM region stays as small as the question allows. The sections
      # that do carry it (`aspout`, `aspin`, `michaelis2d`, `rwoff`, `rwon`,
      # `qmrate`, `asph`) added it for the Asp92 question of ¶133, where its
      # amide is a hydrogen-bond partner of the carboxylate - a different
      # question from the barrier. `prodpost` monitors Gln93 NE2 to Asp92 OD1
      # and to the ligand's O2x, so "far away from everything" is measured on
      # this trajectory rather than assumed (¶171).
      skip_equilibrate: false   # qmmm.inputs sets true; without this there is no MD
      skip_optimize: true       # MD only, as `nacarg` and `ohH` ran
      time: 50
      rigid_water: false

  # ---- wtpost: the same question asked of the REACTANT arm (¶176) ----
  #
  # The product's 34 ns had Asp92 OD2 collapse from 2.80 A to 2.03 because it
  # was outside the 2.5 A detection cutoff and so was never held (¶173). The
  # reactant's `md_wt100` ran under the same cutoff and the same four
  # restraints - hydroxide, His164, HOH, His88, one donor each - so **Asp92 was
  # free there too**, at the same crystallographic 2.80 A.
  #
  # Whether it moved is a measurement, not an inference, and the trajectory is
  # still on disk. It decides something that matters more than either run: if
  # Asp92 collapsed on the reactant arm as well, both arms were equilibrated
  # with a six-coordinate zinc and both need redoing at 3.0 A - the matched
  # control would be intact and at the wrong geometry. If it held, the product's
  # collapse is the product's own, and the reactant's 100 ns stands.
  #
  # `per_residue: false` so each oxygen is reported separately; a mean over the
  # residue would average a bound oxygen with a free one.
  wtpost:
    stage: postprocess
    inputs:
      md_section: md_wt100
      coordination:
        per_residue: false
        margin: 1.0
      hydrogens: true
      # No `monitor`, so no contacts: the coordination sphere is the question,
      # and the reactant's pairs would have to be rewritten for its own ligand.

  # ---- wt100c: the reactant arm re-based at 3.0 A (¶181) ----
  #
  # `md_wt100` and `md_wt100b` are void: the zinc was six-coordinate in 4995 of
  # 5000 frames with Asp92 OD2 bound at 2.07 A in 100% of them, because the
  # 2.5 A cutoff left the 2.80 A contact unrestrained and MM pulled it in
  # (¶177). This is the same correction `prod100c` applies to the product arm,
  # and it is applied the same way so the two arms stay a matched pair.
  #
  # At 3.0 A on `CSR_wt/preprocess_results/finalsystem.pdb`, per atom, the
  # sweep is FIVE contacts - measured, not assumed:
  #
  #     HOH D:1:O        1.90      His88 NE2        2.22
  #     His164 NE2       2.09      **Asp92 OD2      2.80**  <- was free at 2.5
  #     hydroxide O01    2.14
  #
  # and the next three donors are outside it: the substrate's own carboxylate
  # oxygen `mer C:1:O1x` at 3.13, Asp92 OD1 at 3.81, and **Arg90 NH1 at
  # 3.89**. That last one is why 3.0 is a ceiling and not a floor: nitrogen is
  # in `donor_elements`, so the 4.0 A cutoff this project started with
  # restrained an arginine to the zinc as though it were a ligand (¶8).
  #
  # **`constraint_exclude_residues: {C: [1]}` stays.** The reactant's substrate
  # must be free to react, which is the documented reason, and here it costs
  # nothing either way: its nearest atom is 3.13 A, outside the sweep. This is
  # the one place the product arm and this one legitimately differ - there the
  # ligand's own 2.92/2.94 A contacts are crystallographic and holding them is
  # the point.
  #
  # **Asp92 OD1 at 3.81 is restrained explicitly**, as on the product arm and
  # at the user's instruction. It is outside 3.0 so the rule does not reach it,
  # and ¶120 and ¶130 are both the same failure - OD2 held with OD1 free, and
  # the carboxylate pivoting OD1 onto the metal at 1.99.
  #
  # **What this run answers, and what it does not.** It answers plan item 3:
  # does a site restrained at 3.0 A per atom hold four-coordinate through
  # 100 ns? That question is currently unanswered on either arm. It does NOT
  # give a Michaelis complex: the substrate is still Vina pose 2, which is
  # 5.15 A from L1's measured pose (¶156), and items 1-2 replace it by building
  # the reactant from the product through `recombine`. So this is the
  # coordination control, not the reaction's starting structure.
  wt100c:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      restraints:
        - [B:1:ZN, A:92:OD1, 3.81, 50.0]
      nvt_time: 100000
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  # ---- eq5: the Michaelis rebuild - all three properties at once (¶196) ----
  #
  # ¶195 measured 84 equilibrated frames against the Michaelis criteria and
  # every one of them failed. Not for one reason: each run had ONE of the three
  # properties and never the other two.
  #
  #   CSR_crystal_v2   carbonyl on the metal (1.94, frozen), attack angle 30 deg
  #   CSR_nac          attack geometry (3.33 A, 101 deg), carbonyl 5.16 A away
  #   CSR_wt/wt100c    four-coordinate-ish zinc, carbonyl 16.82 A away
  #
  # So this is not a pose problem or a restraint problem on its own. It is that
  # no run has ever restrained all three coordinates together. This section
  # does, and it starts from CSR_crystal_v2's input pose rather than Vina pose
  # 2, because that pose already has the carbonyl on the metal and the move
  # asked for here is 1.94 -> 2.60 rather than 5.43 -> 2.60.
  #
  # **The three restraints.**
  #
  #   [C:2:O01, C:1:C4x, 3.47]        the attack coordinate. `nac` and `wt100b`
  #                                   carried this and `wt100c` REPLACED it
  #                                   rather than adding to it, which is why
  #                                   the substrate left the site (¶194).
  #   [B:1:ZN, C:1:O2x, 2.60, 500]    the carbonyl ON the metal. 2.60 is the
  #                                   middle of the criterion's 2.4-3.0 window
  #                                   and within 0.04 A of what GFN2 chose for
  #                                   itself when QM/MM relaxed crystal_v2's
  #                                   1.94 (it went to 2.56), and of L1's
  #                                   measured 2.53/2.63 (¶121). Not 1.94:
  #                                   that number came from a build decision,
  #                                   nothing measures it, and holding it there
  #                                   is what made crystal_v2's attack angle
  #                                   26-30 deg.
  #   [B:1:ZN, A:92:OD1, 3.81, 500]   OD1 pinned out, as on every arm since
  #                                   ¶130. Outside the 3.0 A sweep, so the
  #                                   rule does not reach it.
  #
  # **500 kcal/mol/A^2, not 50.** ¶191 measured a contact restrained at 2.80 A
  # sitting at a MEAN of 2.44 over 100 ns with a maximum of 2.97 - a 0.36 A
  # offset, which is a systematic force of order 36 kcal/mol/A pulling the
  # carboxylate in, not thermal spread. Offset goes as F/k, so 500 puts it
  # under 0.04 A. The cost is stiffness: at 500 and a 15 amu reduced mass the
  # restrained mode has a ~53 fs period. That is 26 steps at the 2 fs this
  # section sets, which integrates cleanly; at the 4 fs this run directory
  # otherwise inherits it would be 13, which is not enough. This is deliberately a rigid MM
  # site - MM cannot be trusted for coordination (¶174), the MD's job is to
  # equilibrate the protein and solvent AROUND a site held where the crystal
  # has it, and QM/MM is what then decides the coordination.
  #
  # **What the run directory must set, which no section can.** `preprocess`
  # takes no `--section`, so two of this build's changes belong in the new run
  # directory's own `preprocess.inputs`:
  #
  #   remove_residues: [D:1:HOH]   the water the substrate displaces. The
  #                                resting site is four-coordinate, 2 His + 2
  #                                waters (¶120); one water becomes the
  #                                nucleophilic hydroxide and the carbonyl
  #                                takes the other's place. Deleting it after
  #                                solvation would do nothing - the solvent
  #                                refills the position - so it goes before
  #                                the box exists. Check the selector against
  #                                the MERGED input, not the final system:
  #                                preprocess refuses a name that does not
  #                                match rather than deleting the wrong thing.
  #   coordination_force: 500      the swept 3.0 A restraints, for the same
  #                                reason as above. Asp92 OD2 at 2.80 is the
  #                                contact this is for.
  #
  # **What it decides.** Whether a coordinated carbonyl, a near-attack
  # nucleophile and a four- or five-coordinate zinc can coexist in one
  # equilibrated structure at all. If they can, items 1-2 are answered and
  # `wtqm` has a start. If they cannot, the pose itself is wrong and that is a
  # result rather than a failure.
  #
  # 10 ns, not 100. Every 100 ns run in ¶195's inventory is in the rejected
  # list, and nothing was learned at 100 that was not visible at 10.
  #
  # **2 fs, not 4.** The timestep is stated here because this run directory
  # inherits `nvt_timestep: 0.004` from CSR_crystal_v2, and 4 fs against a
  # ~53 fs restrained period is 13 steps per period - below the >=20 that keeps
  # a stiff harmonic integrating cleanly. At 2 fs it is 26.
  #
  # `pdb_file` is given so `sections.py` can CHECK these five selectors against
  # the real solvated system before the MD starts. Run it after `preprocess`,
  # not before: with no structure named, the selector check silently passes.
  eq5:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, A:92:OD1, 3.81, 500.0]
      nvt_time: 10000
      nvt_timestep: 0.002
      traj_frequency: 500
      platform: CUDA
      properties:
        Precision: mixed

  # ---- eq6: eq5 with the two restraints it was missing (¶210) ----
  #
  # eq5 is the best equilibration this project has run: every restraint held,
  # Asp92 OD2 at 2.743 A over 10,000 frames and 0.0% inside 2.5 A, and it was
  # the first structure to hold all three of ¶196's criteria at once (¶197).
  # It was rejected for three things, and ONE unrestrained atom caused the one
  # that matters. So this is eq5 plus two lines, not a rebuild.
  #
  #   1. **`mer` O1x, the 6-(1-hydroxyethyl) alcohol oxygen, at 3.13 A in the
  #      October pose - 0.13 A OUTSIDE the 3.0 A detection radius.** Nothing
  #      restrained it, it came onto the metal at 2.06 A with 97.9% occupancy,
  #      and sitting between the hydroxide and the carbonyl at 76.8 degrees from
  #      both it squeezed the attack angle shut (¶197). `fill_restraints` can
  #      only hold what is inside the radius WHEN IT LOOKS, so a donor arriving
  #      from outside is the one case detection-time restraints cannot cover -
  #      the same failure as `prod100b` (¶173).
  #      The rule already covers it: the 3.0 A set is "what is affected by the
  #      metal", not a coordination test (¶174, ¶186, the user twice), and ¶174
  #      itself restrained Asp92 OD1 at 3.81 A by explicit judgement for being
  #      affected while outside the radius. An alcohol oxygen 0.13 A outside it
  #      is a stronger case than that one.
  #      **Held at 3.82 A, which is what `CSR_mich/preprocess_results/
  #      finalsystem.pdb` ACTUALLY HAS** - measured 2026-11-05, not taken from
  #      ¶197. ¶197's "3.13 A in the October pose" is a different structure, and
  #      restraining to it would have pulled O1x 0.69 A TOWARD the metal, which
  #      is the artefact this line exists to prevent. There is no crystal value
  #      for it: no CSR-1 deposit contains the substrate.
  #      ¶211 adds the reason this is safe: unrestrained QM/MM keeps O1x at
  #      4.24 A mean (3.53-5.04) over michrk's 50 frames, where MM pulled it to
  #      2.18 A in 97.9% of eq5's. So the restraint corrects an MM error and the
  #      quantum answer is further out still, not closer in.
  #      Whether O1x genuinely chelates is NOT settled and MM cannot settle it
  #      (¶197/¶199): a 12-6 term cannot tell an alcohol from a hydroxide and
  #      rewards every oxygen in reach. Holding it where the structure puts it
  #      is what lets QM/MM answer that, per the standing rule.
  #
  #   2. **The Asp92-Lys226 salt bridge, which no run has ever restrained.**
  #      Measured in both wild-type-background deposits: Lys254 NZ - Asp120 OD2
  #      **2.99 A in 6DN4** and **2.83 A in 6DQ2** (our Lys226 - Asp92; 6DN4 is
  #      BBL numbering). OD2 is the bridging oxygen - 2.76 A from the zinc on
  #      one side by superposition, 2.99 A from the lysine on the other, while
  #      OD1 points away from both (3.90 and 5.06 A). So the carboxylate is held
  #      between two cations, and 6NC5 lacks the contact only because its
  #      `SEQADV` records Lys226His as an engineered mutation (¶209).
  #      This is the restraint with the most mechanistic content in the file:
  #      the lysine is what holds Asp92 out of the first shell, so an MD that
  #      does not hold it is free to produce the 2.00 A collapse that three
  #      separate entries have recorded as an artefact. ¶211 measured that it
  #      never forms in the michqm/michrk lineage at all: NZ-OD2 mean 4.66 A,
  #      0% of 50 frames inside 3.2 A.
  #      **Held at 2.79 A, the distance finalsystem.pdb already has** - the
  #      start structure is RIGHT about this contact, which nobody had checked.
  #      2.79 sits inside the deposits' own spread (2.83 in 6DQ2, 2.99 in 6DN4),
  #      and holding it where the structure has it is the project's convention
  #      for every detected contact (¶174). Restraining to 6DN4's 2.99 would
  #      pull it 0.20 A outward for no measured reason.
  #
  #   3. **Asp92 OD1 moves from 3.81 to 3.90 A, so this is three changes from
  #      eq5 rather than two.** finalsystem.pdb has OD1 at **4.09 A** and the
  #      superposition of 6NC5's ZN302 into 6DN4 gives **3.90** (¶210). ¶174's
  #      3.81 has no stated source, and at k = 500 it pulls the second
  #      carboxylate oxygen 0.28 A TOWARD the metal - biasing exactly the
  #      bidentate collapse ¶120 and ¶130 record. 3.90 is the crystal-derived
  #      number; 4.09 would be the structure's own. Flagged because it breaks
  #      the clean one-restraint-differs comparison with eq5, and that is worth
  #      more than the comparison.
  #
  # Nothing else differs from eq5, so the comparison is clean: two restraints
  # added, none changed, none removed. Both at k = 500, because ¶191 measured
  # that 50 kcal/mol/A^2 holds a 2.80 A target at a mean of 2.44/2.37 and
  # holding within ~0.05 A needs of order 500.
  #
  # What it decides: whether the site survives 10 ns with the fifth donor held
  # out and the salt bridge held on - i.e. whether a usable Michaelis start
  # frame exists at all. Read it with `site.py shell` for occupancy at 2.5 A
  # with a 1.0 A margin, and `site.py check --at=reactant` on the last frame.
  # The two numbers to watch that eq5 could not report: `Zn-mer O1x` staying
  # near 3.13 rather than 2.06, and `Lys226 NZ - Asp92 OD2` staying near 2.99.
  # Cost: eq5's own 10 ns at this timestep, on one GPU.
  eq6:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "06:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, A:92:OD1, 3.90, 500.0]    # was 3.81; see ¶212
        - [B:1:ZN, C:1:O1x, 3.82, 500.0]     # the fifth donor; the structure's own
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]  # the salt bridge, the structure's own
      nvt_time: 10000
      nvt_timestep: 0.002
      traj_frequency: 500
      platform: CUDA
      properties:
        Precision: mixed

  # =========================================================================
  # ---- The Asp92 free energy: `aspcg` seeds it, `asp` is the PMF (¶213) ----
  #
  # **This is the experiment ¶133 named and ¶157 costed, and it is the one that
  # settles whether Asp92 sits on the zinc.** An equilibrium is a population and
  # only a free energy reports one; every scan in this log reports a minimum, and
  # ¶94's objection is that a relaxed scan reports the basin it started in.
  #
  # **Why the existing scans cannot seed it, checked 2026-11-05 before
  # submitting anything.** `scan_aspout` and `scan_aspin` are 18 converged
  # points along Zn-Asp92 OD1 and they look like ready-made seeds. They are not
  # usable:
  #
  #   1. Both descend from `CSR_nac/md_naclong_results`, which ¶120, ¶122 and
  #      ¶130 all call the condemned shell and which ¶131 says nothing measured
  #      on can be cited. `retractions.md` carries ¶136 for exactly this.
  #   2. Their range is Zn-OD1 1.90 -> 3.60 A. The wild-type conformer is at
  #      **OD1 3.90 A** (¶210's superposition) and 4.09 A in the start structure,
  #      so both arms stop short of the geometry the question is about - which is
  #      the same error ¶145/¶208 caught in ¶144's costing.
  #   3. ¶157 says it in its own words: "This does not mean the PMF should be run
  #      now ... The order is the rebuilt pose first, this second", because the
  #      pose those scans used is 5.15 A from the only experimental Michaelis
  #      complex in the family (¶156).
  #
  # Seeding from them would have produced an accurate free energy for a
  # condemned shell over a range that misses the answer, at the measured cost of
  # **~8,500 core-hours**. So the chain is `md_eq6` -> `aspcg` -> `asp`, and each
  # link is gated by `sections.py`, which refuses to write a section whose
  # `pdb_file` does not exist yet.
  #
  # **The coordinate is Zn-Asp92 CG, not an oxygen.** The `monitor` block says
  # why: a profile along Zn-OD1 is contaminated every time the carboxylate
  # rotates OD1 out and OD2 in, which is the very motion ¶120 was about, whereas
  # Zn-CG moves only when the whole group moves. It is also the choice the
  # classical carboxylate-cation PMFs make. Range **2.3 -> 4.8 A** at 0.1 A, the
  # 26 windows ¶157 costed: it brackets the bound state and reaches past the
  # wild-type value, which ¶210 measures at **Zn-CG 3.71 A** in the superposed
  # frame. k = 150 kcal/mol/A^2, SMB-1's protocol, 45 ps equilibration + 60 ps
  # of data per window.
  #
  # Cost, measured rather than projected (¶157): **40.9 h per window at 2.57
  # ps/h on 8 cores**, so ~8,500 core-hours, every window inside one 72 h
  # allocation, and the 26 run in parallel for about **two days of wall clock**.
  # CPU, not GPU - xTB is the bottleneck and a GPU does not help it (user).
  #
  # `aspcg` produces one optimised structure per window centre, which is what a
  # distance-CV umbrella needs: `umbrella` has no `pull` for a distance (pulling
  # a bonded pair apart is not a seeding method), so each window reads a `seed`
  # from its own results entry. Writing those 26 entries is the one step between
  # the scan finishing and the PMF starting.
  # ¶218/¶219/¶220: repair eq6's second shell before QM/MM, rather than
  # re-equilibrate. eq6 drifted to Zn-CG 3.72; 6DQH (1.10 A, the only deposit
  # with a Zn1 AND the wild-type lysine) measures 5.15, and every Zn2-bearing
  # construct agrees at 4.66-5.48.
  #
  # This is an `md` section and NOT a `scan` on purpose (¶220). A relaxed scan
  # cannot converge on this system: `optimizer_constraints` switches the whole
  # rigid-water block from geomeTRIC `$freeze` to `$set` as soon as any user
  # constraint appears, so TIP3P O-H distances become convergence criteria that
  # sit ~7x outside `convergence_cmax`. `scan_aspout` was cancelled for this
  # after 120 steps, 160 SVD failures and 4.6 GB of dumps in one point. MD uses
  # harmonic restraints instead of optimiser constraints, so none of that
  # applies, and the surroundings relax at 300 K rather than downhill.
  #
  # Pull ONE coordinate - rule 6: a two-oxygen restraint would assert the
  # carboxylate's rotation, which is ¶130's mistake. Staged in two steps so the
  # 1.4 A displacement is never applied as one impulse. Restraints are eq6's own
  # list minus the Asp92-Zn pair, so nothing new is asserted, and the attack
  # coordinate stays on because freeing Asp92 is measured to let the hydroxide
  # take the vacated face and open O01-C4x (3.48 -> 3.69).
  #
  # constraint_exclude_residues is what stops ¶214 repeating: without it
  # coordination_redetect re-pins Zn-OD2 at its detected 2.81 and fights the pull.
  asppull:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    inputs:
      pdb_file: md_eq6_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false   # ¶214: redetect re-pinned Zn-OD2 at 2.81 and
                                     # held the pulled coordinate at both ends
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, C:1:O1x, 3.82, 500.0]
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:92:CG, 4.45, 50.0]   # stage 1: halfway out, gentle k
      nvt_time: 1000
      nvt_timestep: 0.002
      traj_frequency: 5000   # ¶221: scratch is at 294/300 GB. The deliverable
                             # is the last frame, not the trajectory; 500 would
                             # write ~1.2 GB per ns, twice over (raw + imaged).
      platform: CUDA
      properties:
        Precision: mixed

  # stage 2: on to the crystal distance, from stage 1's last frame
  asppull2:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    inputs:
      pdb_file: md_asppull_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, C:1:O1x, 3.82, 500.0]
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:92:CG, 5.15, 50.0]   # 6DQH's distance
        - [B:1:ZN, A:226:NZ, 5.27, 50.0]  # ¶222: stage 1 moved Zn-CG only 0.10 A
                                          # of 0.73. The carboxylate is tethered
                                          # to NZ at k=500 and the lysine never
                                          # moved (Zn-NZ 3.94 -> 4.03), so the
                                          # salt bridge anchored it. 6DQH has
                                          # Zn-NZ 5.27: the PAIR has to travel.
                                          # Still no OD1/OD2-to-metal restraint,
                                          # so no rotation is asserted (rule 6).
      nvt_time: 2000
      nvt_timestep: 0.002
      traj_frequency: 5000   # ¶221: scratch is at 294/300 GB. The deliverable
                             # is the last frame, not the trajectory; 500 would
                             # write ~1.2 GB per ns, twice over (raw + imaged).
      platform: CUDA
      properties:
        Precision: mixed

  # ¶223: stage 2 moved the LYSINE (Zn-NZ 4.03 -> 4.85 of 5.27) and confirmed
  # stage 1's diagnosis, but the carboxylate still did not follow: Zn-CG reached
  # 3.96 of 5.15. The reason is that Zn-CG is nearly blind to the thing that is
  # wrong. Our OD1 is already at 4.09 against 6DQH's 4.28, while OD2 sits at
  # 2.95 against 5.14 - the carboxylate is ROTATED, with OD2 facing the metal
  # where the crystal has it facing away. A carboxylate can swing about CG
  # without changing Zn-CG much, so pulling CG cannot fix an orientation.
  #
  # So pull the one distance that is actually wrong: Zn-OD2, 2.2 A out of place.
  # That is a single pair at its measured crystal value, not a two-oxygen
  # restraint, so rule 6 still holds - OD1 is left free, and whether it settles
  # near 4.28 of its own accord is then a real test rather than an assertion.
  #
  # k is 500, not 50. Every crystal-derived restraint in eq6 uses 500; the 50 on
  # the pull was my own inconsistency, and ¶154 is why it matters: the Asp92-Zn
  # contact in this model "requires the anionic carboxylate - it is
  # electrostatic, not steric", so MM wants the carboxylate on the metal and a
  # gentle restraint will lose. Fighting the force field here is the POINT of
  # the standing rule: restrain at the crystal distance in MM, because MM cannot
  # be trusted for coordination, then let QM/MM decide where it goes.
  asppull3:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    inputs:
      pdb_file: md_asppull2_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, C:1:O1x, 3.82, 500.0]
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:226:NZ, 5.27, 500.0]
        - [B:1:ZN, A:92:OD2, 5.14, 500.0]
      nvt_time: 2000
      nvt_timestep: 0.002
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  # ¶224: the QM/MM leg of the user's pipeline, from the repaired structure.
  #
  # Start: `md_asppull3`'s last frame, which matches 6DQH on every Asp92/Lys226
  # distance to within 0.1 A - Zn-OD2 5.05 (5.14), Zn-OD1 4.19 (4.28), Zn-CG
  # 5.09 (5.15), Zn-NZ 5.26 (5.27) - with O01-C4x at 3.47 and Asp92 well outside
  # the 2.50 A coordination radius. OD1 reached its crystal distance with
  # NOTHING restraining it, which is why this start is earned rather than built.
  #
  # NOTHING is restrained here, verified by reading rather than assumed:
  # `bond_constraints` in qmmm.py is used only by the optimiser and by rigid
  # water, so the equilibrate applies no coordination restraints, and the region
  # is rebuilt from residue names so ¶115's stale-index trap cannot fire.
  # Asp92 runs free and QM/MM says where it goes, which is the whole point -
  # MM cannot decide coordination (user, repeatedly).
  #
  # Charge 2 checked independently, not inherited (¶152): Zn(2+) - OH(-) +
  # meropenem zwitterion(0) - Asp92(-) = 0 for the michaelis region, plus Arg90
  # and Lys226 = +2.
  #
  # `time` is the TOTAL ps wanted and `resume` continues rather than overwrites,
  # so the 300 ps goes in 50 ps chunks by raising this number: 50 -> 100 -> ...
  # -> 300. At the measured 2.57 ps/h that is ~19.5 h per chunk. The chunking is
  # the insurance: the attack coordinate is free too, and stage 3 left five
  # donors inside 2.50 A (a second water, HOH3095 at 2.01, took the space Asp92
  # vacated). Whether that water leaves is what this run is for; if instead the
  # nucleophile drifts, one chunk tells us at 20 h rather than 120.
  # ¶225: NOT 100 ns. The length is set by measurement, not by the pipeline's
  # round number, and `convergence.py` settled it from trajectories we already
  # had.
  #
  # eq6's own 10 ns is converged: CA RMSD vs frame 0 plateaus by the third
  # decile (~3 ns) at ~1.1 A and stays flat; RMSF reaches within 3% of its final
  # value by 5 ns (r = 0.986 against the full profile); T = 300.31 +/- 1.45 K
  # with +0.14 drift; box volume drift +0.65 nm3. Nothing in it is still moving.
  #
  # asppull3's 2 ns is NOT converged: RMSD climbs 0.75 -> 0.91 with its three
  # highest deciles last, and box volume drift is +5.40 nm3 against eq6's +0.65,
  # eight times larger. The box is still accommodating the 1.3-2.2 A
  # displacement of the Asp92/Lys226 pair. So `skip_npt` is FALSE here - the
  # earlier draft of this section had it true, which the box data says is wrong.
  #
  # `gentle: false` is the point: every pull stage inherited the warm-up from
  # the run directory's base `md` inputs and re-annealed from 1 K over 40 ps
  # before its own NVT, so the 15 ns on record is four short equilibrations
  # rather than one trajectory. This continues instead.
  #
  # Why 10 ns and not more: it is the length eq6 demonstrated is sufficient for
  # this system, so matching it is the measured answer. No 100 ns trajectory
  # survives to check against - wt100c and wt100b keep only last frames and
  # checkpoints - and the longest that does, prod100c at 22.68 ns, never
  # plateaus (RMSD +0.51 A, still rising at the end). That run is the product
  # arm that rearranged and then NaN'd, so its drift is pathology rather than
  # evidence about equilibration time, but it is the reason this is a claim
  # about eq6's system and not a general one.
  #
  # ~45 min on one H100 at eq6's measured 10 ns / 43.7 min. Re-run
  # convergence.py afterwards and require eq6's plateau before QM/MM.
  relax10:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "03:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    # From relax10.sh: the run is NPT then 10 ns of NVT production, and
    # `gentle` would spend 40 ps of 300 K MD before NPT for nothing (¶227).
    require:
      unset: [skip_npt, skip_nvt, gentle]
      equals: {nvt_time: 10000}
    inputs:
      pdb_file: md_asppull3_results/NVTtrajectory_lastframe.pdb
      # Standard mcube: minimise -> NPT box equilibration -> NVT production.
      # `gentle: false` IS the library default (README: "for a system that will
      # not start otherwise"), and it is set explicitly here only because this
      # run directory's base `md` inputs override it to true, so a section that
      # stays silent inherits the warm-up. The warm-up is 0.055 ps of annealing
      # followed by 40 ps of ordinary 300 K MD *before* NPT: after a successful
      # minimisation it buys nothing NPT does not, and those 40 ps are long
      # enough for a force-field artefact to develop in a box that has not been
      # equilibrated yet - which on this system means coordination drift, the one
      # thing the run exists to avoid. Starting frame is already 300 K and
      # equilibrated, so there is nothing to warm up (¶227, corrected).
      gentle: false
      coordination_redetect: false
      restraints:
        - [C:2:O01, C:1:C4x, 3.47]
        - [B:1:ZN, C:1:O2x, 2.60, 500.0]
        - [B:1:ZN, C:1:O1x, 3.82, 500.0]
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:226:NZ, 5.27, 500.0]
        - [B:1:ZN, A:92:OD2, 5.14, 500.0]
      nvt_time: 10000
      nvt_timestep: 0.002
      traj_frequency: 1000
      platform: CUDA
      properties:
        Precision: mixed

  # SUPERSEDED by `aspqm2`. Kept, not deleted: job 32384737 ran this for 5.16 ps
  # (5159 fs at a 1 fs step) before being cancelled, and `qmmm_aspqm_results`
  # still holds that output. It started from `asppull3`'s 2 ns frame, which the
  # convergence analysis showed is not relaxed - box volume drift +5.40 nm3
  # against eq6's +0.65 - so it was a pilot, not the pipeline's QM/MM leg
  # (¶226, ¶228). Do not re-run it: `resume: true` would continue those 5.16 ps.
  aspqm:
    stage: qmmm
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    # Reconciled when these moved out of the launchers (¶239): `aspqm.sh` and
    # `aspqm2.sh` only WARNED here while `aspdft.sh` refused. Refusing is right -
    # a restrained carboxylate measures the restraint, and ¶134's $set switch
    # makes convergence unreachable the moment `opt_constraints` appear.
    require:
      unset: [restraints, opt_constraints, constraints]
    inputs:
      pdb_file: md_asppull3_results/NVTtrajectory_lastframe.pdb
      qm_residues: *qmreg_michrk
      charge: 2
      skip_equilibrate: false
      skip_optimize: true
      time: 50
      resume: true
      rigid_water: false

  # The QM/MM leg proper: same QM region, same charge, same everything as
  # `aspqm`, but starting from the END of the 10 ns NVT rather than from the
  # unrelaxed 2 ns frame. A NEW section name, deliberately, so it writes to a
  # fresh `qmmm_aspqm2_results` and `resume: true` cannot pick up the cancelled
  # run's state file. The 300 ps still goes in six 50 ps chunks by raising
  # `time` to 100, 150, 200, 250, 300 and re-running, one at a time (¶228).
  aspqm2:
    stage: qmmm
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    # Reconciled when these moved out of the launchers (¶239): `aspqm.sh` and
    # `aspqm2.sh` only WARNED here while `aspdft.sh` refused. Refusing is right -
    # a restrained carboxylate measures the restraint, and ¶134's $set switch
    # makes convergence unreachable the moment `opt_constraints` appear.
    require:
      unset: [restraints, opt_constraints, constraints]
      # The point of this section is that it starts from the END of the 10 ns,
      # not the unrelaxed 2 ns frame that job 32384737 was cancelled for (¶228).
      equals: {pdb_file: md_relax10_results/NVTtrajectory_lastframe.pdb,
               charge: 2, rigid_water: false}
    inputs:
      pdb_file: md_relax10_results/NVTtrajectory_lastframe.pdb
      qm_residues: *qmreg_michrk
      charge: 2
      skip_equilibrate: false
      skip_optimize: true
      time: 50
      resume: true
      rigid_water: false

  # ---- The def2-SVP QM/MM geometry optimisation (¶233/¶234). ----
  #
  # The instrument of record for Asp92's position. ¶232 showed GFN2 chelates the
  # carboxylate onto Zn1 within 8 ps from a crystal-consistent start, so the
  # semiempirical answer is a method artefact and only DFT can say where the
  # carboxylate sits. The user's decision (¶233): skip the QM/MM equilibration
  # entirely - long QM/MM is only practical at xTB - and optimise at def2-SVP
  # directly from the MM frame.
  #
  # **It starts from `relax10`'s last frame, NOT from chunk 1's.** Chunk 1's
  # geometry already has Asp92 bidentate on the zinc, which is the thing being
  # tested; starting there would hand DFT the answer and ¶206 rule 3 would
  # exclude the result. `relax10` is the crystal-consistent start, matching
  # 6DQH's Zn-OD1 to 0.05 A with nothing restraining it (¶231).
  #
  # `skip_equilibrate: true` is the user's instruction and also the only
  # affordable choice: a DFT QM/MM MD step costs what a gradient costs.
  #
  # **Nothing is constrained, deliberately and for two reasons.** The carboxylate
  # has to be free or the run measures the restraint; and ¶134 - a $set block
  # appears the moment a qmmm run is given `opt_constraints`, which makes
  # convergence impossible. Supplying none keeps geomeTRIC on $freeze only.
  # `rigid_water: false` for the same reason (¶137).
  #
  # **`actradius: 0` - the active region is the QM atoms ONLY, and that is the
  # one setting the channel project's measured experience changed (¶235).** Their
  # r2SCAN/def2-SVP QM/MM optimisations with an 8 A active region containing MM
  # waters never converged in 150 steps, and the energy climbed 30-45 kcal/mol
  # after a minimum while geomeTRIC rated every step good. With the active region
  # cut to the QM atoms, the same jobs converged in 44 steps, and all 60 of their
  # round-2 jobs in 27-100.
  #
  # This does NOT contradict this project's own 5 A failure, which is why both
  # records can be kept. That run blew the MM term from -240 to +1139 Eh because
  # a *partially* shrunk region leaves active MM atoms pressed against frozen
  # neighbours and the optimiser drives them into the wall. With the region cut
  # to the QM atoms there are **no active MM atoms at all**, so that failure mode
  # has nothing to act on. mcube returns `list(qm_atoms)` directly when
  # `actradius` is falsy, so no `actregiondefine` call is made and the QM region
  # is trivially contained in the active one.
  #
  # **What the frozen environment costs, stated rather than buried.** The second
  # shell cannot relax: Ser186, the bulk waters and the backbone are held at the
  # MM geometry the 10 ns trajectory ended on. Everything the question turns on is
  # quantum and free - Zn, hydroxide, substrate, Asp92, Lys226, Arg90, Asn225,
  # His88, His164 - so the carboxylate's position is decided by DFT against a
  # fixed environment rather than a relaxed one. That is the standard
  # minimum-refinement approximation and it is what makes the leg affordable.
  #
  # No `opt_coordsystem` override. ASH switches TRIC to HDLC by itself whenever an
  # active region is set, and the SVD degeneracies both projects hit came from
  # rigid-water *constraints*, of which this run has none - `rigid_water` is off
  # (the library default since ¶137) and no `opt_constraints` are supplied, so
  # geomeTRIC gets no constraint block at all. `cart` is the fallback if it
  # degenerates anyway, and `cart` refuses to run with constraints present.
  #
  # **COST.** Two measured anchors, neither exactly this calculation: ~26 min per
  # wb97x-v/def2-SVP/MM single point on 119 QM atoms on 8 cores (¶215's level,
  # this project), and 4.6 min per r2SCAN/def2-SVP/MM optimisation step on ~50 QM
  # atoms with 64k MM charges on 32 cores, of which SCF 49 s, gradient 62 s and
  # the remaining 2.8 min the point-charge terms (the channel project). Scaling
  # their QM part to 124 atoms gives ~20 min a step, and wb97x-v costs more per
  # SCF than a meta-GGA with no VV10, so 20-35 min is the honest band. Their core
  # scaling was only 1.25x for 16 -> 32 at 28 QM atoms, so 32 cores is not assumed
  # to buy 4x. `opt_maxiter: 60` against a 48 h wall is sized for the top of that
  # band: ASH raises at maxiter and mcube keeps the last geometry and writes
  # `QM_MM_optimized.pdb` with `converged: false`, whereas a walltime kill writes
  # no PDB at all. If 60 steps is not enough, chunk 2 sets `pdb_file` to this
  # run's `QM_MM_optimized.pdb`.
  #
  # One thing to watch in the log, from their experience: the DFT grid adds
  # ~1e-4 Eh/A of gradient noise, comparable with geomeTRIC's own thresholds, so
  # formal convergence can stall near a minimum that is physically reached.
  #
  # The functional is the library default and is stated anyway: wb97x-v is the
  # level ¶215's cluster benchmark used, so this geometry and that calibration
  # point are at the same level and can be compared.
  aspdft:
    stage: qmmm
    submit: {partition: general, cores: 32, mem: 120G, time: "48:00:00"}
    # Reconciled when these moved out of the launchers (¶239): `aspqm.sh` and
    # `aspqm2.sh` only WARNED here while `aspdft.sh` refused. Refusing is right -
    # a restrained carboxylate measures the restraint, and ¶134's $set switch
    # makes convergence unreachable the moment `opt_constraints` appear.
    require:
      unset: [restraints, opt_constraints, constraints]
      equals: {pdb_file: md_relax10_results/NVTtrajectory_lastframe.pdb,
               charge: 2, rigid_water: false, actradius: 0,
               skip_equilibrate: true, skip_optimize: false,
               qm_engine: dft, dft_basis: def2-svp}
    inputs:
      pdb_file: md_relax10_results/NVTtrajectory_lastframe.pdb
      qm_residues: *qmreg_michrk
      charge: 2
      qm_engine: dft
      dft_functional: wb97x-v
      dft_basis: def2-svp
      dft_cores: 32           # match --cpus-per-task; DFT scales, unlike xTB
      actradius: 0            # active region = the QM atoms only (¶235)
      skip_equilibrate: true
      skip_optimize: false
      opt_maxiter: 60
      rigid_water: false

  # ---- The GFN2 half of the matched comparison (¶238). ----
  #
  # `aspdft` measures where the DFT gradient takes Asp92 from the
  # crystal-consistent frame. On its own that is not a clean comparison with
  # ¶232's chelation, and ¶236 said so: **¶232 was 50 ps of 300 K dynamics and
  # `aspdft` is a 0 K optimisation**, which has no thermal energy to cross a
  # barrier it might find. So "GFN2 moves it, DFT does not" could be a
  # difference between dynamics and minimisation rather than between
  # Hamiltonians.
  #
  # This section removes that confound. It is `aspdft` with one key changed -
  # `qm_engine` back to its default xtb - so the frame, the QM region, the
  # charge, the active region, the optimiser, its convergence criteria and the
  # absence of constraints are all identical. **The only difference is the
  # Hamiltonian**, which is what makes the pair interpretable: if GFN2
  # minimises Asp92 onto the zinc from a start where DFT minimises it away,
  # that is the Hamiltonian, measured rather than inferred from a cluster
  # benchmark (¶215) or from a trajectory at a different temperature.
  #
  # **Pre-registered readings, before the result, per ¶178:**
  #   - **GFN2 pulls Asp92 inside ~2.5 A while DFT holds it near 5** -> the
  #     cleanest possible statement of the bias, on one structure with one
  #     variable changed. ¶232 stops being the only evidence and stops being
  #     vulnerable to the dynamics-vs-minimisation objection.
  #   - **Both keep it out** -> ¶232's chelation needed 300 K, so it is a
  #     barrier-crossing GFN2 makes too easy rather than a minimum GFN2 puts in
  #     the wrong place. A different and weaker claim, and
  #     `gfn2-over-coordinates-zn1-from-a-crystal-consistent-start` would have
  #     to be narrowed to say so.
  #   - **Both bring it in** -> the approach is not a method artefact and the
  #     crystals are being reproduced by neither. That would be the expensive
  #     outcome and it would point at the force field or the starting pose
  #     rather than at the QM level.
  #
  # Cheap, which is the other reason to run it: the 8 A xTB optimisation of this
  # system ran at ~159 s a step, and most of that was geomeTRIC's linear
  # algebra over 467 active atoms rather than xTB itself. With the active region
  # cut to the 124 QM atoms both parts shrink, so `opt_maxiter` can be the base
  # 300 and a converged minimum is reachable inside one job - unlike the DFT
  # leg, whose 48 h buys ~25 steps (¶236).
  #
  # 8 cores, not 32: xTB does not scale and the DFT leg has the cores.
  # The gate is `require:`, not a launcher script. `same_as` is what makes this
  # a controlled comparison: it refuses to write the section if anything other
  # than the QM level and the step budget differs from `aspdft`, which no
  # hand-written check could be trusted to keep true as either arm is edited.
  aspxtb:
    stage: qmmm
    require:
      unset: [restraints, opt_constraints, constraints]
      equals: {charge: 2, rigid_water: false, skip_equilibrate: true,
               skip_optimize: false}
      same_as:
        section: aspdft
        except: [qm_engine, dft_functional, dft_basis, dft_cores, opt_maxiter]
    submit: {cores: 8, mem: 16G, time: "24:00:00", partition: general}
    inputs:
      pdb_file: md_relax10_results/NVTtrajectory_lastframe.pdb
      qm_residues: *qmreg_michrk
      charge: 2
      actradius: 0            # identical to aspdft (¶235)
      skip_equilibrate: true
      skip_optimize: false
      opt_maxiter: 300
      rigid_water: false

  # ---- Does letting the environment relax change the answer? (¶241) ----
  #
  # ¶240 left a confound it could not remove: both optimisations differ from
  # ¶232's 300 K dynamics in TWO ways, being 0 K **and** holding the MM
  # environment frozen (the active region is the QM atoms only, ¶235). So the
  # chelate's absence from both minima is consistent with needing thermal
  # energy, with needing the second shell to relax, or with both.
  #
  # This removes one of the two. It continues from `aspxtb`'s **converged**
  # minimum - the only converged QM/MM geometry in the project - and reopens the
  # 8 A active region, so ~485 atoms are free where 124 were. Same Hamiltonian,
  # same QM region, same charge, nothing constrained: only `pdb_file` and
  # `actradius` differ from `aspxtb`, and the `require.same_as` gate refuses to
  # write this section if anything else does.
  #
  # **Pre-registered, before the result (¶178):**
  #   - **Asp92 comes in toward ~2.5 A once the environment is free** -> the
  #     frozen shell was holding it out, ¶240's narrowing was premature, and the
  #     0 K-versus-300 K half of the confound is the one that does not matter.
  #   - **Asp92 stays out, near 5 A** -> the frozen environment was not the
  #     reason, so the chelate needs thermal energy. ¶240's narrowing stands and
  #     strengthens: GFN2's minimum is not where the chelation lives, under
  #     either treatment of the environment.
  #   - **It does not converge in 300 steps** -> the expected outcome, not a
  #     failure; the channel project's flexible-water 8 A runs were monotonic and
  #     still unconverged at 300. Read the trajectory's direction instead, which
  #     is what the first two readings actually turn on.
  #
  # **Not expected to converge, and that is designed for.** Our own 8 A xTB
  # optimisation of this system ran at ~159 s a step with geomeTRIC's linear
  # algebra over 467 active atoms as the cost driver, so 300 steps is ~13 h and
  # fits the wall. `rigid_water` stays false: the channel project's 8 A runs
  # climbed 30-45 kcal/mol UPHILL with good step quality because the rigid-water
  # constraints degenerate TRIC's coordinate system, and with no constraints at
  # all geomeTRIC gets no constraint block (confirmed for `aspdft` by
  # `constraints.txt` being absent, ¶237).
  aspxtb8:
    stage: qmmm
    submit: {partition: general, cores: 8, mem: 32G, time: "24:00:00"}
    require:
      unset: [restraints, opt_constraints, constraints]
      same_as: {section: aspxtb, except: [pdb_file, actradius]}
    inputs:
      pdb_file: protdft/qmmm_aspxtb/QM_MM_optimized.pdb
      qm_residues: *qmreg_michrk
      charge: 2
      actradius: 8
      skip_equilibrate: true
      skip_optimize: false
      opt_maxiter: 300
      rigid_water: false

  aspcg:
    stage: scan
    inputs:
      pdb_file: md_eq6_results/NVTtrajectory_lastframe.pdb
      atoms: [B:1:ZN, A:92:CG]
      start: 2.3
      end: 4.8
      points: 26
      opt_maxiter: 300
      extra_qm_residues: {A: [93]}
      resume: true

  # The PMF itself. `engine: qmmm` runs every window through ASH on a
  # QMMMTheory with mcube's ordinary QM region, and the biased pair is dropped
  # from the coordination restraints automatically - those two forces would add,
  # and WHAM is only told about the bias.
  asp:
    stage: umbrella
    inputs:
      coordinate: distance
      atoms: [B:1:ZN, A:92:CG]
      cv_start: 2.3
      cv_end: 4.8
      spacing: 0.1
      k: 150
      engine: qmmm
      equilibrate: 45
      time: 60
      extra_qm_residues: {A: [93]}

  # ---- wtqm: the reactant's QM/MM MD, matching prodqm (¶190) ----
  #
  # Same treatment as the product arm so the two stay comparable: the RQK set in
  # MM, charge 0, 50 ps of GFN2-xTB QM/MM MD from the equilibrated frame. Gated
  # on `wtpostc` passing, exactly as `prodqm` is gated on `prodpostc`.
  #
  # The region is the reactant's own chains: the hydroxide is `C:2:OH` and the
  # substrate `C:1:mer`, where the product has `D:1:hyd` and a second water.
  wtqm:
    stage: qmmm
    inputs:
      qm_residues: *qmreg_wt
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      skip_equilibrate: false   # qmmm.inputs sets true; without this there is no MD
      skip_optimize: true       # MD only, as prodqm runs
      time: 50
      rigid_water: false

  # ---- michqm: the production QM/MM, 300 ps in 50 ps batches (user, ¶198) ----
  #
  # What it is for: a GFN2-xTB QM/MM trajectory long enough to seed the charge
  # deletion and the NEB. 300 ps total, run as six 50 ps batches by raising
  # `time` and resubmitting - `time` is the **total** wanted and `resume: true`
  # continues from `OpenMM_MD_state.xml`, so a batch is a one-line change and a
  # walltime-limited run never restarts from zero (¶182/¶183).
  #
  # **300 ps, not 300 ns.** The user asked for ns and the arithmetic rules it
  # out: at the ~1 s per fs step these runs cost, 300 ns is of order 9 years of
  # walltime. 300 ps is 6x the longest QM/MM run in the project and is what was
  # agreed.
  #
  # **It starts from `cluster/frame_o1x_off.pdb`, frame 4374 of `md_eq5`, and
  # that is a deliberate selection that has to be declared.** It is the frame of
  # 10,000 with the longest Zn-O1x (3.74 A), found while building the cluster
  # benchmark, and it is the **only structure in the project where the carbonyl
  # is the substrate oxygen nearest the zinc** - `site.py check` passes five of
  # seven criteria on it, against four on the last frame, failing only the
  # attack angle (68 deg) and the Asp92 OD1-O01 H-bond (5.67 A).
  #
  # Choosing it over the last frame matters because QM/MM here is hysteretic:
  # no run in this project has crossed the coordination boundary in either
  # direction (¶197 corrections), so whichever donor is on the metal at the
  # start is the one that will be on it at the end. Starting from the last frame
  # would bake in O1x at 2.06 A and answer nothing. Starting from an extremum of
  # a distribution is still a selection, and anything measured here describes
  # the reactant state we chose, not an equilibrium average.
  #
  # Treatment matches `prodqm` and `wtqm` so the arms stay comparable: RQK set
  # in MM, charge 0, MD only, flexible water.
  michqm:
    stage: qmmm
    inputs:
      pdb_file: cluster/frame_o1x_off.pdb
      qm_residues: *qmreg_mich
      charge: 0            # Arg90 and Lys226 are MM (¶190); stated, not inherited (¶152)
      skip_equilibrate: false   # qmmm.inputs sets true; without this there is no MD
      skip_optimize: true       # MD only, as prodqm runs
      time: 50                  # TOTAL ps wanted; raise to 100/150/200/250/300 per batch
      resume: true              # continue rather than overwrite on the next batch
      rigid_water: false

  # ---- michrk: batch 1 continued with the lysine able to act (user, ¶202) ----
  #
  # Identical to `michqm` in every other key, so the two are a controlled pair:
  # what differs is that Arg90 and Lys226 are quantum and the charge is +2.
  # Batch 1 settled the coordination sphere and refuted the Burgi-Dunitz gate
  # (¶201); it could not say anything about the nucleophile, because the residue
  # sitting 2.82 A from it was a set of fixed point charges.
  #
  # **Starts from batch 1's last frame, not from `frame_o1x_off.pdb`.** That
  # frame is 50 ps of GFN2-equilibrated geometry at the level of theory this run
  # uses, and it is the frame in which Lys226 NZ has already arrived at 2.82 A -
  # the geometry the question is about. Restarting from frame 4374 would spend
  # picoseconds travelling back to it. Its Asp92 is on the metal at 2.00 A, and
  # that is deliberate too: ¶201 watched that move happen spontaneously from the
  # designed four-coordinate start with nothing imposed, so 2.00 A is this
  # model's own answer rather than a bad starting structure. Nothing is
  # restrained here either - the standing rule is that MD gets crystal
  # restraints and QM/MM gets none, because QM/MM's coordination behaviour is
  # the thing being measured.
  #
  # A new section rather than a `time` bump on `michqm`: `resume: true` restores
  # `OpenMM_MD_state.xml`, and resuming a state file written with a different QM
  # region and a different total charge is the silent-wrong-species failure of
  # ¶152. The new directory starts empty, so there is nothing to clear (¶199),
  # and batch 1 stays on disk as the control.
  #
  # What it decides: whether Lys226 NH3+ hands its proton to the zinc-bound
  # hydroxide - making the nucleophile a water and the base a neutral amine,
  # which is the only candidate base left now that Asp92 has failed three times
  # (¶201) - or whether ¶41's canonical B3 reactant survives its first honest
  # test. Either answer is publishable; neither is reachable with the lysine in
  # MM.
  michrk:
    stage: qmmm
    inputs:
      pdb_file: protdft/qmmm_michqm/QM_MM_lastframe.pdb
      qm_residues: *qmreg_michrk
      charge: 2            # michaelis 0 + Arg90 + Lys226; stated, not inherited (¶152)
      skip_equilibrate: false   # qmmm.inputs sets true; without this there is no MD
      skip_optimize: true       # MD only, as michqm ran
      time: 50                  # TOTAL ps wanted; raise per batch as michqm does
      resume: true              # continue rather than overwrite on the next batch
      rigid_water: false

  # ---- The two radii, and why the analysis sets its own (¶186) ----
  #
  # `preprocess.inputs.cutoff` is **3.0 A** and it answers one question: what
  # is close enough to the metal to be AFFECTED by it, and therefore has to be
  # held at the distance the crystal has rather than left for the force field
  # to pull in. That set is not the coordination sphere. It is deliberately
  # wider than it, because the contacts between 2.5 and 3.0 A are exactly the
  # ones that are not bonds and will become bonds if nothing holds them (¶174,
  # ¶177).
  #
  # **The coordination number is a different measurement and takes a stricter
  # radius: 2.5 A**, the longest Zn-O distance that is still a bond
  # (`LIGAND_MAX`). At 2.5 A the product's site is two histidines, the
  # hydroxide-derived oxygen and one water - FOUR - with Asp92 OD2 at 2.80 and
  # the ligand's O4x/O5x at 2.92/2.94 correctly outside it, restrained in the
  # second shell where the crystal puts them.
  #
  # So these sections set `coordination.cutoff: 2.5` explicitly. Without it the
  # stage falls back to `preprocess.inputs.cutoff`, which is now the restraint
  # radius, and the report would count seven "ligands" on a site that has four
  # - the same number read against two different questions. `margin: 1.0` then
  # still SHOWS everything out to 3.5 A, which is what makes the held contacts
  # visible without counting them.
  #
  # And a transient bulk water inside 2.5 A is not a failure: MM cannot be
  # trusted for coordination at all, which is why the restraints exist, and
  # water comes and goes. The coordination behaviour that counts is QM/MM's.
  prodpostc:
    stage: postprocess
    inputs:
      md_section: md_prod100c
      hydrogens: true
      coordination:
        cutoff: 2.5
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-HOH C1: [B:1:ZN, C:1:O]
        Zn-HOH C2: [B:1:ZN, C:2:O]
        Zn-hyd O4x: [B:1:ZN, D:1:O4x]
        Zn-hyd O5x: [B:1:ZN, D:1:O5x]
        Zn-hyd O2x: [B:1:ZN, D:1:O2x]
        Zn-hyd O6x: [B:1:ZN, D:1:O6x]
        Zn-hyd N1x: [B:1:ZN, D:1:N1x]
        C4x-N1x: [D:1:C4x, D:1:N1x]
        O6x-C4x: [D:1:O6x, D:1:C4x]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]
        Lys226 NZ-hyd O6x: [A:226:NZ, D:1:O6x]
        Arg229 NH2-hyd O4x: [A:229:NH2, D:1:O4x]

  wtpostc:
    stage: postprocess
    inputs:
      md_section: md_wt100c
      hydrogens: true
      coordination:
        cutoff: 2.5
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      # The reactant's own names: its substrate is `mer` in chain C, its
      # nucleophile the hydroxide `OH C:2:O01`, and the second water is `D:1:O`
      # - the chains are not the product's (¶181).
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-hydroxide O01: [B:1:ZN, C:2:O01]
        Zn-HOH D1: [B:1:ZN, D:1:O]
        Zn-mer O1x: [B:1:ZN, C:1:O1x]
        Zn-mer O2x: [B:1:ZN, C:1:O2x]
        Zn-Arg90 NH1: [B:1:ZN, A:90:NH1]
        O01-mer C4x: [C:2:O01, C:1:C4x]
        Lys226 NZ-O01: [A:226:NZ, C:2:O01]
        # ¶209/¶210: the salt bridge, and it had never been monitored anywhere.
        # Lys254 NZ - Asp120 OD2 is 2.99 A in 6DN4 and 2.83 A in 6DQ2 (our Lys226 -
        # Asp92; both deposits are BBL numbering). OD2 is the BRIDGING oxygen: 2.76 A
        # from the zinc on one side by superposition, 2.99 A from the lysine on the
        # other, with OD1 pointing away from both (3.90 and 5.06 A). Both oxygens are
        # here because ¶120 is what happens when only one of them is watched.
        Lys226 NZ-Asp92 OD2: [A:226:NZ, A:92:OD2]
        Lys226 NZ-Asp92 OD1: [A:226:NZ, A:92:OD1]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]

  # ---- michpost: did the Michaelis sphere hold for 10 ns? (¶197) ----
  #
  # `md_eq5`'s last frame has the three configured restraints exactly where they
  # were set - carbonyl O2x 2.645 against 2.60, Asp92 OD1 3.782 against 3.81,
  # O01-C4x 3.458 against 3.47 - and an **unrestrained** sixth donor that was
  # not there at the start: `mer`'s 1-hydroxyethyl oxygen O1x at 2.06 A, closer
  # to the zinc than the carbonyl and as close as the hydroxide nucleophile.
  # O1x was outside the 3.0 A sphere at preprocess, so no restraint was placed
  # on it; it came in from outside during the MD, which is the one thing
  # detection-time restraints cannot prevent.
  #
  # This is the same failure the `prod100b` note below records in the product
  # arm, where an unrestrained ligand oxygen came from 6.76 A onto the metal at
  # 2.01 A. `wtpostc` was already monitoring `Zn-mer O1x` for that reason. One
  # frame cannot say whether this is an artefact that took hold or a transient,
  # which is what this section is for.
  #
  # `cutoff: 2.5`, stated and not inherited: with it unset `postprocess` falls
  # back to the 3.0 A restraint radius and would count what is merely affected
  # by the metal as bonded to it (¶186).
  #
  # No `Zn-HOH D1` here: this build has no `D:1:HOH`. Removing it is what made
  # the sphere the Michaelis one (¶196), and `sections.py` would refuse the
  # section for naming an atom the structure does not have - which is the check
  # working.
  michpost:
    stage: postprocess
    inputs:
      md_section: md_eq5
      hydrogens: true
      coordination:
        cutoff: 2.5
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-hydroxide O01: [B:1:ZN, C:2:O01]
        Zn-mer O1x: [B:1:ZN, C:1:O1x]
        Zn-mer O2x: [B:1:ZN, C:1:O2x]
        Zn-mer O3x: [B:1:ZN, C:1:O3x]
        Zn-mer O4x: [B:1:ZN, C:1:O4x]
        Zn-Arg90 NH1: [B:1:ZN, A:90:NH1]
        O01-mer C4x: [C:2:O01, C:1:C4x]
        Lys226 NZ-O01: [A:226:NZ, C:2:O01]
        # ¶209/¶210: the salt bridge, and it had never been monitored anywhere.
        # Lys254 NZ - Asp120 OD2 is 2.99 A in 6DN4 and 2.83 A in 6DQ2 (our Lys226 -
        # Asp92; both deposits are BBL numbering). OD2 is the BRIDGING oxygen: 2.76 A
        # from the zinc on one side by superposition, 2.99 A from the lysine on the
        # other, with OD1 pointing away from both (3.90 and 5.06 A). Both oxygens are
        # here because ¶120 is what happens when only one of them is watched.
        Lys226 NZ-Asp92 OD2: [A:226:NZ, A:92:OD2]
        Lys226 NZ-Asp92 OD1: [A:226:NZ, A:92:OD1]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]

  # ---- prod100b: WITHDRAWN, do not submit (¶173) ----
  #
  # This resumed from frame 1704 on the assumption that the 34 ns before the
  # NaN were sound. They were not. `prodpost` on that trajectory found the zinc
  # SIX-coordinate in 1704 of 1707 frames: Asp92 OD2 collapsed from its
  # crystallographic 2.80 A to 2.03 A mean at 99.9% occupancy, and the ligand
  # turned over - O2x came from 6.76 A onto the metal at 2.01 A while O4x and
  # O5x, the two contacts the crystal has at 2.94 and 2.92, left for 6.64 and
  # 8.46 A. Restarting from that frame would carry all of it into the QM/MM,
  # and no cutoff undoes an artefact already in the coordinates.
  #
  # Kept rather than deleted because the restart machinery is right and only
  # its starting structure was wrong. Nothing should be submitted from here.
  prod100b:
    stage: md
    inputs:
      pdb_file: protdft/postprocess_prodpost/restart_1704.pdb
      coordination_redetect: false
      restraints:
        - [B:1:ZN, C:1:O, 1.90, 50.0]
        - [B:1:ZN, A:164:NE2, 2.09, 50.0]
        - [B:1:ZN, C:2:O, 2.14, 50.0]
        - [B:1:ZN, A:88:NE2, 2.22, 50.0]
      nvt_time: 65920
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  # ---- prod100c: detection at 3.0 A, every contact it finds restrained (¶174)
  #
  # The rule, already established and which I had not applied: **anything
  # within 3 A of the zinc is affected by it and is restrained at its
  # crystallographic distance.** Detecting at 2.5 A was my own reading of
  # ¶120/¶130, and it is wrong in the way that matters: the cutoff decides
  # which contacts are *held*, so everything from 2.5 to 3.0 A was left free to
  # collapse instead. That is what happened - Asp92 OD2 went 2.80 -> 2.03 and
  # the ligand turned over, O2x travelling 4.75 A onto the metal (¶173).
  #
  # At 3.0 A on `finalsystem.pdb` the sweep is seven contacts: HOH C:1 1.90,
  # His164 2.09, HOH C:2 2.14, His88 2.22, **Asp92 OD2 2.80**, **hyd O5x 2.92**
  # and **hyd O4x 2.94** - the crystal's four, plus the three that were free.
  # `coordination_redetect: true` applies `preprocess.inputs.cutoff`, now 3.0,
  # to this structure, so the restraints are a measurement of the file rather
  # than a list typed by hand.
  #
  # `constraint_exclude_residues` no longer names the ligand: it is right for
  # the reactant, whose substrate must be free to react, and it is what left
  # the product's own two zinc contacts unheld.
  #
  # **One restraint beyond the sweep, and it is a judgement: Asp92 OD1 at
  # 3.81 A.** ¶120 and ¶130 are the same failure twice - OD2 held at 2.80 with
  # OD1 free, and the carboxylate pivoted OD1 onto the metal at 1.99. A
  # monodentate restraint on a bidentate group holds a distance, not a
  # geometry. OD1 is outside 3 A so the rule does not reach it, but it is
  # bonded to a carbon whose other oxygen is 2.80 A from the metal, so it is
  # certainly affected by it. Strike this line if the group should be free to
  # pivot.
  prod100c:
    stage: md
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: true
      restraints:
        - [B:1:ZN, A:92:OD1, 3.81, 50.0]
      nvt_time: 100000
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  # ---- The product arm's reaction coordinate (¶170) ----
  #
  # Order: `prodopt` (a stationary product), then the two scans BACKWARDS along
  # the reaction, then NEB over each step. Nothing here can be submitted until
  # `prodqm` has written a frame; the distances each scan starts from are the
  # ones that frame has, which is why no `start` is set below - `scan` defaults
  # it to the current distance and records what it used.
  #
  # **Why the endpoints must be built this way and cannot be preprocessed.**
  # `neb` refuses endpoints that differ in atom count OR in atom order, and it
  # is right to: it interpolates atom i of one toward atom i of the other, so a
  # mismatched order converges to a path between atoms that are not
  # counterparts. A reactant built through its own `preprocess` run will not
  # match this product however carefully prepared - different solvation,
  # different atom order. `scan` writes every point through THIS system's MM
  # topology, so every structure it produces is this product in another
  # geometry. That is the only route to a valid NEB pair on this arm.
  #
  # **Two scans, not one.** The hydrolysed product is two steps from the
  # Michaelis complex, so one coordinate cannot reach it. Shortening C4x-N1x
  # re-forms the ring and gives the tetrahedral INTERMEDIATE, with the
  # nucleophile-derived oxygen still on C4x; only then does lengthening
  # O6x-C4x expel it and give the Michaelis complex. Driving C4x-N1x alone
  # would force a ring closure onto a carbon that still has four substituents.
  #
  # **The atom names are the parameterised ones.** `C4x` and `N1x` happen to be
  # unchanged, but the nucleophile oxygen this log calls `O01` is `O6x` here
  # (¶168). Check `preprocess.results.ligand_atom_map` before adding any ligand
  # selector - preprocess now records and warns about the renaming (¶169).
  #
  # **What this arm buys beyond a second path.** The reactant arm reaches the
  # intermediate forwards (`attack`) and this one reaches it backwards: two
  # independent routes to one species, from two different crystal structures.
  # They should agree, and a disagreement is a result about the model rather
  # than about CSR-1.
  # ---- the product arm's Asp92 repair, ¶249 ----
  #
  # WHY THESE EXIST. `prod100c` (31423830) NaN'd at 22.68 ns out of a perfectly
  # stable trajectory because it ran at **4 fs**: it has no `nvt_timestep`, so
  # it inherited 0.004 from the run directory's base `md` inputs. Every reactant
  # section states 0.002 explicitly - `eq5` wrote the reason down weeks ago and
  # the product arm never received it. 1.5 Da hydrogen mass with HBonds-only
  # constraints does not support 4 fs.
  #
  # AND IT NEEDS MORE THAN THE TIMESTEP. `finalsystem.pdb` has Asp92 at
  # Zn-OD2 2.795, Zn-OD1 3.811, Zn-CG 3.692, Zn-NZ 4.356 where 6DQH gives
  # 5.14 / 4.28 / 5.15 / 5.27 - so the carboxylate must move ~2.3 A outward,
  # which is `asppull`'s three-stage job (¶218/¶220/¶222-¶224). The old
  # `md_prod100c` restraint targets 3.81, the value ¶216 VOIDED, and
  # `coordination_redetect: true` re-adds the voided 2.80 - so both are off here.
  #
  # WHAT DIFFERS FROM THE REACTANT'S PULL, and it is the one real difference:
  # **no substrate restraint at all.** ¶159 measured that nothing of the
  # hydrolysed product is within coordination range of Zn1; everything that
  # binds, binds the Zn2 CSR-1 does not have. Writing an `O2x`/`O1x` term here
  # would transplant a Zn2 bond into a one-metal enzyme.
  #
  # Staging mirrors the reactant: stage 1 moves the pair with CG and NZ soft,
  # stage 2 stiffens them, stage 3 asserts 6DQH's OD2 distance directly. 2 ns a
  # stage at 2 fs, ~7 min each on one H100.
  prodpull:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    require:
      unset: [skip_npt, skip_nvt, gentle]
      equals: {nvt_timestep: 0.002, coordination_redetect: false,
               nvt_time: 2000}
    inputs:
      pdb_file: preprocess_results/finalsystem.pdb
      coordination_redetect: false
      restraints:
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:92:CG, 5.15, 50.0]
        - [B:1:ZN, A:226:NZ, 5.27, 50.0]
      nvt_time: 2000
      nvt_timestep: 0.002
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  prodpull2:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    require:
      unset: [skip_npt, skip_nvt, gentle]
      same_as: {section: prodpull, except: [pdb_file, restraints]}
    inputs:
      pdb_file: md_prodpull_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false
      restraints:
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:92:CG, 5.15, 500.0]
        - [B:1:ZN, A:226:NZ, 5.27, 500.0]
      nvt_time: 2000
      nvt_timestep: 0.002
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  prodpull3:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "01:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    require:
      unset: [skip_npt, skip_nvt, gentle]
      same_as: {section: prodpull2, except: [pdb_file, restraints]}
    inputs:
      pdb_file: md_prodpull2_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false
      restraints:
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:226:NZ, 5.27, 500.0]
        - [B:1:ZN, A:92:OD2, 5.14, 500.0]
      nvt_time: 2000
      nvt_timestep: 0.002
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  # ---- prodrelax10: the product arm's match to `relax10` ----
  #
  # 10 ns, the length `eq6` demonstrated is sufficient (¶225/¶226), at 2 fs,
  # `gentle: false` so this continues rather than re-annealing from 1 K, NPT NOT
  # skipped because ¶225's box data says the box is still accommodating the
  # Asp92/Lys226 displacement after a 2 ns pull. ~45 min on one H100.
  #
  # Gate before `prodqm`: `convergence.py`, requiring eq6's plateau - CA RMSD
  # flat over the final three deciles, T drift under 0.2 K, restraints held to
  # ~0.1 A - and Asp92 OUTSIDE the 2.50 A coordination radius with the zinc
  # four-coordinate. `prod100c` failed exactly those two (6-coordinate in
  # 852/1134 frames, Asp92 OD2 mean 2.37), which is what this arm is repairing.
  prodrelax10:
    stage: md
    submit: {partition: gpu_cuda, cores: 4, mem: 32G, time: "04:00:00",
             extra: [--qos=gpu, --gres=gpu:h100:1]}
    require:
      unset: [skip_npt, skip_nvt, gentle]
      equals: {nvt_time: 10000, nvt_timestep: 0.002,
               coordination_redetect: false}
    inputs:
      pdb_file: md_prodpull3_results/NVTtrajectory_lastframe.pdb
      coordination_redetect: false
      restraints:
        - [A:226:NZ, A:92:OD2, 2.79, 500.0]
        - [B:1:ZN, A:226:NZ, 5.27, 500.0]
        - [B:1:ZN, A:92:OD2, 5.14, 500.0]
      nvt_time: 10000
      nvt_timestep: 0.002
      traj_frequency: 5000
      platform: CUDA
      properties:
        Precision: mixed

  prodopt:
    stage: qmmm
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    require:
      unset: [restraints, opt_constraints, constraints, qm_engine]
      equals: {charge: 0, rigid_water: false, skip_equilibrate: true,
               skip_optimize: false}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      pdb_file: protdft/qmmm_prodqm/lastframe.pdb   # fill in from prodqm
      skip_equilibrate: true
      skip_optimize: false
      rigid_water: false

  recombine:                   # reverse step 2: close the ring to the intermediate
    stage: scan
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, points: 12, opt_maxiter: 300, resume: true}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      pdb_file: protdft/qmmm_prodopt/QM_MM_optimized.pdb
      atoms: [D:1:C4x, D:1:N1x]
      end: 1.39                # as measured in the reactant's optimised complex
      points: 12               # `start` omitted: scan takes the optimised distance
      monitor:
        - [B:1:ZN, D:1:N1x]    # does the leaving nitrogen re-engage the metal
        - [A:226:NZ, D:1:N1x]  # Lys226 as the proton's source or sink
        - [D:1:O6x, D:1:C4x]   # must stay bonded through this scan
        - [B:1:ZN, A:92:OD2]   # Asp92 must not come onto the metal en route
      opt_maxiter: 300
      resume: true

  expel:                       # reverse step 1: push the nucleophile back off
    stage: scan
    submit: {partition: general, cores: 8, mem: 16G, time: "24:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, points: 16, opt_maxiter: 300, resume: true}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      pdb_file: protdft/scan_recombine/scan_12.pdb
      atoms: [D:1:O6x, D:1:C4x]
      end: 3.00                # where `attack` starts from on the reactant arm
      points: 16
      monitor:
        - [B:1:ZN, D:1:O6x]    # the oxygen should return to the metal as hydroxide
        - [B:1:ZN, D:1:O2x]    # and the carbonyl should disengage
        - [A:226:NZ, D:1:O6x]
        - [D:1:C4x, D:1:N1x]   # the ring must stay closed
      opt_maxiter: 300
      resume: true

  # NEB over each step of this arm, as `step1`/`step2` do for the reactant's.
  # Endpoints are keys and not arguments for the same reason as there: the two
  # minima are what the barrier belongs to. Fill each in from the run that
  # produced it, and check the active-region counts match across both endpoints
  # and the NEB - `actradius` is measured per structure, so one radius can give
  # two slightly different regions, and energies over different sets of movable
  # atoms are not comparable.
  #
  # **That check is NOT in the `require:` gates below, and deliberately (¶252).**
  # `actradius: 0` would make the two regions identical by construction - the
  # region is then the QM atoms, which are selected by residue name and so are
  # the same set in both endpoints. But `actradius: 0` also FREEZES the MM
  # environment, and the two endpoints have different environments, so their MM
  # energies differ by a constant that does not cancel in a barrier. ¶235 chose
  # `actradius: 0` for OPTIMISATIONS, where there is one structure and the
  # frozen term is constant; whether it is right for a NEB across two
  # structures has not been established, and gating on it would have smuggled
  # that decision in. Settle it before these run.
  pstep2:                      # intermediate <-> product
    stage: neb
    submit: {partition: general, cores: 8, mem: 32G, time: "48:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, images: 12, method: nebts, interpolation: idpp}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      reactant_pdb: protdft/scan_recombine/scan_12.pdb
      product_pdb: protdft/qmmm_prodopt/QM_MM_optimized.pdb
      images: 12
      method: nebts
      interpolation: idpp

  pstep1:                      # Michaelis complex <-> intermediate
    stage: neb
    submit: {partition: general, cores: 8, mem: 32G, time: "48:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, images: 12, method: nebts, interpolation: idpp}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      reactant_pdb: protdft/scan_expel/scan_16.pdb
      product_pdb: protdft/scan_recombine/scan_12.pdb
      images: 12
      method: nebts
      interpolation: idpp

  # A saddle is a transition state only if it has exactly one imaginary mode and
  # that mode is the reaction coordinate; `ts` checks both, then runs an IRC in
  # each direction to establish it connects the two minima the NEB was built
  # from and not some other pair.
  psaddle2:
    stage: ts
    submit: {partition: general, cores: 8, mem: 32G, time: "48:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, tsopt: true, freq: true, irc_method: mode}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      pdb_file: protdft/neb_pstep2/saddlepoint.pdb
      hessian_atoms: [D:1:C4x, D:1:N1x, D:1:O6x, A:226:NZ, B:1:ZN]
      monitor:
        - [D:1:C4x, D:1:N1x]
        - [A:226:NZ, D:1:N1x]
      tsopt: true
      freq: true
      irc_method: mode

  psaddle1:
    stage: ts
    submit: {partition: general, cores: 8, mem: 32G, time: "48:00:00"}
    require:
      unset: [qm_engine]
      equals: {charge: 0, tsopt: true, freq: true, irc_method: mode}
    inputs:
      qm_residues: *qmreg_prod
      charge: 0            # 2 -> 0: Arg90 and Lys226 are MM now (¶190)
      pdb_file: protdft/neb_pstep1/saddlepoint.pdb
      hessian_atoms: [D:1:O6x, D:1:C4x, D:1:O2x, B:1:ZN]
      monitor:
        - [D:1:O6x, D:1:C4x]
        - [B:1:ZN, D:1:O2x]
      tsopt: true
      freq: true
      irc_method: mode

  # ---- qmrate: what does QM/MM MD actually cost? (¶152) ----
  #
  # ¶151 costed umbrella sampling at ~62 h per window from 1.7 ps/h, and that
  # figure came from a job that was CANCELLED before it had run long enough to
  # measure - so the 13,000 core-hours the entry quotes rests on a soft number.
  # 3 ps on 8 cores from the same structure and the same QM region every
  # production run uses gives a real rate, and the entry can then be corrected
  # either way.
  #
  # `skip_optimize: true` because this is a timing, not a result: optimising
  # first would measure the optimiser. Same charge and region as `aspin`, so the
  # rate transfers to the windows it is used to cost.
  qmrate:
    stage: qmmm
    inputs:
      pdb_file: protdft/scan_aspin/scan_08.pdb
      extra_qm_residues: {A: [93]}
      skip_equilibrate: false    # MD *is* the equilibrate step - ¶153
      skip_optimize: true
      time: 3
      rigid_water: false

  # ---- asph: does a NEUTRAL Asp92 stay on the zinc? (¶152) ----
  #
  # The user's test (2026-10-30): "obviously protonating asp prevents it from
  # coordinating - might be worthwhile doing a quick semi-empirical QM/MM run
  # with that assumption". Protonating the carboxylate is the one change that
  # removes the electrostatic reason for the contact without moving an atom, so
  # whatever the metal does next is the model's own answer rather than ours.
  #
  # **Starts from `scan_aspin/scan_08.pdb`, not scan_00.** scan_00 is aspin's
  # 3.60 A end, where Asp92 is ALREADY off the metal, so protonating it there
  # asks whether a neutral acid comes back - not the question. scan_08 is the
  # 1.90 A end: five ligands, OD1 at 1.90, OD2 at 3.43, hydroxide 1.94, HOH485
  # 2.19, both histidines. If the proton makes the contact unfavourable, this is
  # the structure that has something to lose.
  #
  # `--to=ASH` puts HD2 on OD2, the oxygen that is NOT on the metal (3.43 A),
  # leaving the bound OD1 bare - which is the chemically sensible tautomer and
  # the only one ff14SB defines. Nearest contact to the new proton is 1.82 A to
  # a water hydrogen, tight but not an overlap (`protonate` refuses below 1.2).
  #
  # `charge: 3`, not the inherited 2: the residue goes -1 -> 0, so both the
  # system's and the QM region's total charge rise by one. A run left at 2 is
  # wrong without looking wrong - the SCF converges on the wrong species.
  # Nothing is restrained and nothing is held: `opt_constraints` is absent by
  # design, so Asp92 is free to leave and the answer is a distance, not a
  # criterion.
  asph:
    stage: qmmm
    inputs:
      pdb_file: protdft/scan_aspin/scan_08_A92_ASH.pdb
      extra_qm_residues: {A: [93]}
      charge: 3
      skip_equilibrate: true
      skip_optimize: false
      opt_maxiter: 300
      rigid_water: false

  # Names here carry NO stage prefix: `sections.py` writes each one as `<stage>_<name>`,
  # so the name `qmmm_ref` under `stage: sp` is the mcube section `sp_qmmm_ref`.
  # Naming it `sp_qmmm_ref` here gives the key `sp_sp_qmmm_ref`, and jobs 31176144/
  # 31176145 died in 8 s on exactly that (¶152). sections.py now refuses it.
  qmmm_ref:
    stage: sp
    inputs: &sp_cd
      pdb_file: protdft/scan_aspin/scan_00.pdb
      sp_cores: 16

  qmmm_r229:
    stage: sp
    inputs:
      <<: *sp_cd
      zero_charges_qm_only: [A:229]

  # Gln93 is the only one of the four RQK cations/amides that CAN be measured
  # this way: `preprocess.results.qm_residues` puts Arg90 and Lys226 INSIDE the
  # QM region, where electrostatic embedding has already removed their MM
  # charges, so deleting them again cannot change the energy and the difference
  # would be noise reported as a contribution (¶153). `charge_deletion` refuses
  # them by name. Gln93 is in MM for these two sections - they do not set
  # `extra_qm_residues`, unlike the scans - so it has charges to delete.
  qmmm_q93:
    stage: sp
    inputs:
      <<: *sp_cd
      zero_charges_qm_only: [A:93]

  dft:                      # score a geometry someone else produced
    stage: sp
    inputs: &sp_only
      sp_cores: 64

  # ¶63: is xTB's 22.4 kcal/mol for pulling the carbonyl off real? Same check
  # as ¶58 did for Asp92, on three points of the carbonyl scan. Separate
  # sections because each run writes its results back into its own.
  co0:
    stage: sp
    inputs:
      <<: *sp_only
      pdb_file: protdft/coscan/scan_00.pdb   # Zn-O2x 2.15 A
  co4:
    stage: sp
    inputs:
      <<: *sp_only
      pdb_file: protdft/coscan/scan_04.pdb   # Zn-O2x 3.08 A
  co8:
    stage: sp
    inputs:
      <<: *sp_only
      pdb_file: protdft/coscan/scan_08.pdb   # Zn-O2x 4.00 A

  # ---- The GFN2-vs-DFT cluster benchmark (P1, open since ¶9; built ¶188) ----
  #
  # The question: does GFN2-xTB hold meropenem's 6-(1-hydroxyethyl) oxygen O1x
  # on the zinc when DFT would not? `md_eq5` found O1x coordinated in 97.9% of
  # 10,000 frames at 2.18 A mean, closer than the restrained carbonyl and as
  # close as the anionic hydroxide (¶197), and neither MM nor QM/MM MD can
  # adjudicate it - MM overfavours octahedral zinc, and no QM/MM run here has
  # ever crossed the coordination boundary in either direction, because ligand
  # exchange at Zn(II) is slower than the affordable trajectory.
  #
  # The quantity is a **difference of differences**, which is Imhof's protocol:
  #
  #     dd = [E_off - E_on](GFN2) - [E_off - E_on](DFT)
  #
  # Negative `dd` means GFN2 stabilises the O1x-bound form relative to DFT, and
  # `dd` is the size of the error. Both methods see the SAME two geometries, so
  # strain and thermal noise cancel in the difference and the method does not.
  # Imhof measured 7.55 kcal/mol for AM1/d on a 4 -> 5 coordination change; the
  # GFN2 number is what these four sections produce.
  #
  # Geometries from `docs/csr/build-cluster.py`: the shortest and longest
  # Zn-O1x frames of the same trajectory, so neither bracket carries a build
  # difference or a hand displacement. 51 atoms, `charge: 0` **stated** and not
  # inherited (¶152), mult 1 for d10 Zn(II).
  #
  # These are single points, so they are NOT binding energies - `sp` is a
  # single-point stage by construction and optimising both clusters at both
  # levels is a separate job. Say so wherever the number is quoted.
  # ---- michqmpost: the 50 ps QM/MM batch 1, analysed through the stage ----
  #
  # `postprocess --qmmm` is NOT the route here: it loads the BASE `qmmm`
  # section rather than the one the job ran as, and it reads
  # `results.opttraj`, which a run with `skip_optimize: true` never writes. So
  # this section names `pdb_file` and `trajectory` outright, which
  # `postprocess` supports for exactly this case, and the result still lands in
  # the config instead of in a script's stdout.
  #
  # Topology is the FIRST frame, not the last: the atom order is the same in
  # both, and reading a trajectory against its own first frame is the
  # convention everywhere else here.
  #
  # Two monitored distances are new and are the point of the batch. `Zn-mer
  # O2x` is the carbonyl, restrained in every previous run and **unrestrained**
  # here for the first time, so this is the first test of whether it stays on
  # the metal by itself. `Asp92 OD1-O01` is the proton relay, 5.67 A at the
  # start and also unrestrained. `Zn-Asn225 OD1` is here because ¶198 found
  # Asn225 taking the site O1x vacated, which is how a sphere stays
  # five-coordinate while looking as though it emptied.
  #
  # `monitor_angles` is the attack angle, and the whole reason `postprocess`
  # now has one: 68 degrees at the start against the 95-120 a nucleophile
  # approaching a trigonal carbon needs. ¶198 measured it with a one-off script
  # on three frames, so there is no record of it in any config - the failure
  # ¶168 records for contacts, repeated.
  #
  # `cutoff: 2.5` stated and not inherited, for the ¶186 reason: unset,
  # `postprocess` falls back to the 3.0 A restraint radius and counts what is
  # merely affected by the metal as bonded to it.
  michqmpost:
    stage: postprocess
    inputs:
      pdb_file: protdft/qmmm_michqm/QM_MM_firstframe.pdb
      trajectory: protdft/qmmm_michqm/QM_MM.dcd
      hydrogens: true
      coordination:
        cutoff: 2.5
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-Asn225 OD1: [B:1:ZN, A:225:OD1]
        Zn-hydroxide O01: [B:1:ZN, C:2:O01]
        Zn-mer O1x: [B:1:ZN, C:1:O1x]
        Zn-mer O2x: [B:1:ZN, C:1:O2x]
        Zn-mer O3x: [B:1:ZN, C:1:O3x]
        Zn-mer O4x: [B:1:ZN, C:1:O4x]
        Zn-Arg90 NH1: [B:1:ZN, A:90:NH1]
        O01-mer C4x: [C:2:O01, C:1:C4x]
        Asp92 OD1-O01: [A:92:OD1, C:2:O01]
        Lys226 NZ-O01: [A:226:NZ, C:2:O01]
        # ¶209/¶210: the salt bridge, and it had never been monitored anywhere.
        # Lys254 NZ - Asp120 OD2 is 2.99 A in 6DN4 and 2.83 A in 6DQ2 (our Lys226 -
        # Asp92; both deposits are BBL numbering). OD2 is the BRIDGING oxygen: 2.76 A
        # from the zinc on one side by superposition, 2.99 A from the lysine on the
        # other, with OD1 pointing away from both (3.90 and 5.06 A). Both oxygens are
        # here because ¶120 is what happens when only one of them is watched.
        Lys226 NZ-Asp92 OD2: [A:226:NZ, A:92:OD2]
        Lys226 NZ-Asp92 OD1: [A:226:NZ, A:92:OD1]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]
        O01-mer O2x: [C:2:O01, C:1:O2x]
      angles:
        window: [95, 120]
      monitor_angles:
        O01-C4x-O2x: [C:2:O01, C:1:C4x, C:1:O2x]
        O01-C4x-N1x: [C:2:O01, C:1:C4x, C:1:N1x]
        # Not an attack angle, so it carries its own window: whether the
        # nucleophile and the carbonyl are TRANS across the zinc or adjacent
        # to it. 150-180 is trans. Measured because the Burgi-Dunitz angle is
        # not free once both oxygens are on one metal - two ligands 3.0 A
        # apart cannot put the nucleophile above the carbon - so the attack
        # angle and this one are the same fact seen twice, and only this one
        # says what to change.
        O01-Zn-O2x:
          atoms: [C:2:O01, B:1:ZN, C:1:O2x]
          window: [150, 180]

  # ---- michrkpost: the same analysis, for the batch where K can act ----
  #
  # Every key michqmpost has, pointing at `qmmm_michrk` instead, so the two
  # reports are comparable line for line and a difference between them is a
  # difference between the two regions rather than between two analyses. What
  # is added is the set of pairs that answer ¶202, and nothing is removed.
  #
  # This section is the reason `postprocess` gained a per-pair cutoff. A
  # proton-transfer coordinate is a BOND length, and the section cutoff is a
  # polar-contact convention: 3.5 A scores a 1.0 A O-H pair at 100% occupancy
  # in a trajectory where nothing moved at all. `{atoms: [...], cutoff: 1.2}`
  # is the same override `monitor_angles` already had for a window, for the
  # same reason - one section's measurements are not all the same question.
  #
  # Run it with the batch's OWN first frame as topology, as michqmpost does.
  michrkpost:
    stage: postprocess
    inputs:
      pdb_file: protdft/qmmm_michrk/QM_MM_firstframe.pdb
      trajectory: protdft/qmmm_michrk/QM_MM.dcd
      hydrogens: true
      coordination:
        cutoff: 2.5
        per_residue: false
        margin: 1.0
      contacts:
        cutoff: 3.5
      monitor:
        Zn-Asp92 OD2: [B:1:ZN, A:92:OD2]
        Zn-Asp92 OD1: [B:1:ZN, A:92:OD1]
        Zn-His88: [B:1:ZN, A:88:NE2]
        Zn-His164: [B:1:ZN, A:164:NE2]
        Zn-Asn225 OD1: [B:1:ZN, A:225:OD1]
        Zn-hydroxide O01: [B:1:ZN, C:2:O01]
        Zn-mer O1x: [B:1:ZN, C:1:O1x]
        Zn-mer O2x: [B:1:ZN, C:1:O2x]
        Zn-mer O3x: [B:1:ZN, C:1:O3x]
        Zn-mer O4x: [B:1:ZN, C:1:O4x]
        Zn-Arg90 NH1: [B:1:ZN, A:90:NH1]
        O01-mer C4x: [C:2:O01, C:1:C4x]
        Asp92 OD1-O01: [A:92:OD1, C:2:O01]
        Lys226 NZ-O01: [A:226:NZ, C:2:O01]
        # ¶209/¶210: the salt bridge, and it had never been monitored anywhere.
        # Lys254 NZ - Asp120 OD2 is 2.99 A in 6DN4 and 2.83 A in 6DQ2 (our Lys226 -
        # Asp92; both deposits are BBL numbering). OD2 is the BRIDGING oxygen: 2.76 A
        # from the zinc on one side by superposition, 2.99 A from the lysine on the
        # other, with OD1 pointing away from both (3.90 and 5.06 A). Both oxygens are
        # here because ¶120 is what happens when only one of them is watched.
        Lys226 NZ-Asp92 OD2: [A:226:NZ, A:92:OD2]
        Lys226 NZ-Asp92 OD1: [A:226:NZ, A:92:OD1]
        Gln93 NE2-Asp92 OD1: [A:93:NE2, A:92:OD1]
        O01-mer O2x: [C:2:O01, C:1:O2x]
        # ---- ¶202's question, and the only pairs that answer it ----
        #
        # A transfer shows up as a swap: the N-H bond stretches past 1.2 A
        # while one H-O01 distance falls under it. Which hydrogen goes is not
        # known in advance, so all three are monitored - a proton keeps its
        # atom name when it moves, so watching only the one that happens to
        # point at the acceptor in the first frame is how the event is missed.
        # Each carries `cutoff: 1.2`, the per-pair override: scored against
        # the section's 3.5 A every one of these reads 100% in every frame
        # whether anything happened or not.
        #
        # `O01-H03` is the control - the hydroxide's own proton, which should
        # stay on it at ~0.97 A throughout. If it leaves as well the species
        # is an oxide, not a water, and the run has gone somewhere else
        # entirely. `Asp92 OD1-H03` is the opposite direction, which ¶201's
        # three failures make the less likely one but not the untested one.
        Lys226 NZ-HZ1: {atoms: [A:226:NZ, A:226:HZ1], cutoff: 1.2}
        Lys226 NZ-HZ2: {atoms: [A:226:NZ, A:226:HZ2], cutoff: 1.2}
        Lys226 NZ-HZ3: {atoms: [A:226:NZ, A:226:HZ3], cutoff: 1.2}
        HZ1-O01: {atoms: [A:226:HZ1, C:2:O01], cutoff: 1.2}
        HZ2-O01: {atoms: [A:226:HZ2, C:2:O01], cutoff: 1.2}
        HZ3-O01: {atoms: [A:226:HZ3, C:2:O01], cutoff: 1.2}
        O01-H03: {atoms: [C:2:O01, C:2:H03], cutoff: 1.2}
        Asp92 OD1-H03: {atoms: [A:92:OD1, C:2:H03], cutoff: 1.2}
        # Arg90 is quantum here too, so its own donors are monitored for the
        # first time rather than assumed inert: it is a cation 3.6 A from the
        # substrate carboxylate (¶150) and nothing has yet watched it reach
        # anywhere else.
        Arg90 NH1-O01: [A:90:NH1, C:2:O01]
        Arg90 NH2-O01: [A:90:NH2, C:2:O01]
        Arg90 NE-mer O2x: [A:90:NE, C:1:O2x]
      angles:
        window: [95, 120]
      monitor_angles:
        # A proton in flight is nearly linear through the hydrogen. Vertex is
        # the MIDDLE selector, so this is the N-H...O angle, and 150-180 is
        # the hydrogen-bond geometry a transfer has to pass through. A short
        # H-O01 distance at 110 degrees is a contact across the oxygen's lone
        # pairs, not a transfer.
        NZ-HZ1-O01:
          atoms: [A:226:NZ, A:226:HZ1, C:2:O01]
          window: [150, 180]
        NZ-HZ2-O01:
          atoms: [A:226:NZ, A:226:HZ2, C:2:O01]
          window: [150, 180]
        NZ-HZ3-O01:
          atoms: [A:226:NZ, A:226:HZ3, C:2:O01]
          window: [150, 180]
        O01-C4x-O2x: [C:2:O01, C:1:C4x, C:1:O2x]
        # Scored against NOTHING, explicitly. The section window is the
        # Burgi-Dunitz one and Burgi-Dunitz is defined for Nu-C=O, which is
        # `O01-C4x-O2x`. The angle to the LEAVING nitrogen is not that
        # criterion: a tetrahedral carbon puts any two of its substituents at
        # about 109 degrees, so this triple reads 99-119 in the frames
        # measured so far and would score as a pass inside a 95-120 window
        # while meaning nothing about an approach. `window: null` is how
        # `angle_occupancy` says there is no criterion - the spread is
        # reported and the occupancy comes back None.
        O01-C4x-N1x:
          atoms: [C:2:O01, C:1:C4x, C:1:N1x]
          window: null
        # Not an attack angle, so it carries its own window: whether the
        # nucleophile and the carbonyl are TRANS across the zinc or adjacent
        # to it. 150-180 is trans. Measured because the Burgi-Dunitz angle is
        # not free once both oxygens are on one metal - two ligands 3.0 A
        # apart cannot put the nucleophile above the carbon - so the attack
        # angle and this one are the same fact seen twice, and only this one
        # says what to change.
        O01-Zn-O2x:
          atoms: [C:2:O01, B:1:ZN, C:1:O2x]
          window: [150, 180]


